<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock — Diente de León</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; color: #2d2d2d; background: #f9fafb; padding-bottom: 40px; }

/* ── HEADER ── */
.header { display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: #fff; border-bottom: 3px solid #3a7d44; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 6px rgba(0,0,0,.07); }
.header img { height: 38px; }
.header h1 { font-size: 16px; font-weight: 800; color: #3a7d44; flex: 1; }
.header-meta { font-size: 11px; color: #9ca3af; }
.btn-icon { background: none; border: none; font-size: 18px; cursor: pointer; padding: 4px 8px; color: #6b7280; }

/* ── PAGE ── */
.page-wrap { max-width: 900px; margin: 0 auto; padding: 14px 16px; }

/* ── LEGEND ── */
.legend { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 8px; padding: 8px 14px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.05); flex-wrap: wrap; font-size: 11px; color: #6b7280; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; display: inline-block; }
.dot-rojo     { background: #dc2626; }
.dot-amarillo { background: #f59e0b; }
.dot-verde    { background: #16a34a; }
.legend-item  { display: flex; align-items: center; gap: 5px; }
.legend-sep   { flex: 1; }
.last-update  { font-size: 10px; color: #9ca3af; }

/* ── PRODUCTO CARD ── */
.producto-card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.07); margin-bottom: 8px; overflow: hidden; }

.producto-header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; user-select: none; }
.producto-header:hover { background: #f9fafb; }

/* Semáforo con stock en el header */
.semaforo-group { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; align-items: center; min-width: 32px; }
.sem-item { display: flex; align-items: center; gap: 4px; }
.sem-stock { font-size: 11px; font-weight: 700; line-height: 1; }
.sem-stock.stock-rojo     { color: #dc2626; }
.sem-stock.stock-amarillo { color: #f59e0b; }
.sem-stock.stock-verde    { color: #16a34a; }

.prod-info { flex: 1; min-width: 0; }
.prod-nombre { font-size: 13px; font-weight: 800; color: #111827; }
.prod-meta { display: flex; align-items: center; gap: 7px; margin-top: 3px; flex-wrap: wrap; }
.prod-fgp  { font-size: 10px; color: #6b7280; }
.chevron { font-size: 11px; color: #9ca3af; transition: transform .2s; flex-shrink: 0; }
.chevron.open { transform: rotate(180deg); }

/* ── PEDIDO BADGE (mismos colores que pedidos.html) ── */
.pedido-badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 100px; font-size: 10px; font-weight: 700; padding: 2px 8px; text-decoration: none; white-space: nowrap; border: 1px solid; }
.pedido-badge.solicitado { background: #fff8e1; color: #b45309; border-color: #fcd34d; }
.pedido-badge.confirmado { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.pedido-badge.en-camino  { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }

/* ── VARIANTES ── */
.variantes-wrap { display: none; border-top: 1px solid #f3f4f6; }
.variantes-wrap.open { display: block; }

/* ── TABLA DE VARIANTES ── */
.var-table { width: 100%; border-collapse: collapse; }
.var-table thead tr { background: #f9fafb; }
.var-table thead th {
  font-size: 10px; color: #9ca3af; text-transform: uppercase; letter-spacing: .4px;
  padding: 5px 10px; border-bottom: 1px solid #f0f0f0; font-weight: 600; white-space: nowrap;
}
.var-table thead th.th-c { text-align: center; }
.var-table tbody tr { border-bottom: 1px solid #f9fafb; }
.var-table tbody tr:last-child { border-bottom: none; }
.var-table td { padding: 8px 10px; vertical-align: middle; }

.td-dot  { width: 16px; padding-right: 0 !important; }
.td-nombre { font-size: 12px; color: #4b5563; font-weight: 400; }
.td-alerta { width: 20px; text-align: center; font-size: 11px; }
.td-stock  { text-align: center; width: 60px; font-size: 20px; font-weight: 900; line-height: 1; }
.td-umbral, .td-piso { text-align: center; width: 88px; }
.td-vel    { text-align: center; width: 64px; font-size: 11px; color: #9ca3af; }
.td-save   { width: 90px; text-align: right; white-space: nowrap; }

.stock-rojo    { color: #dc2626; }
.stock-amarillo{ color: #f59e0b; }
.stock-verde   { color: #16a34a; }

/* ── INPUTS ── */
.ov-wrap { display: inline-flex; align-items: center; justify-content: center; gap: 3px; position: relative; }
.ov-input {
  width: 54px; padding: 4px; font-size: 12px;
  border: 1px solid #e5e7eb; border-radius: 5px;
  text-align: center; background: #f9fafb; color: #374151;
}
.ov-input:focus { outline: none; border-color: #3a7d44; background: #fff; }
.ov-input.has-override { border-color: #f59e0b; background: #fefce8; color: #854d0e; font-weight: 700; }

/* ── TOOLTIP ── */
.tip-btn {
  background: none; border: 1px solid #d1d5db; border-radius: 50%;
  width: 13px; height: 13px; font-size: 8px; cursor: pointer;
  color: #9ca3af; display: inline-flex; align-items: center; justify-content: center;
  padding: 0; flex-shrink: 0;
}
.tip-box {
  display: none; position: fixed;
  background: #1f2937; color: #f3f4f6;
  font-size: 10px; padding: 6px 9px; border-radius: 7px; width: 200px;
  line-height: 1.6; z-index: 9999; white-space: pre-line; box-shadow: 0 4px 14px rgba(0,0,0,.2); width: 240px; font-size: 11px;
}
.ov-wrap.tip-open .tip-box { display: block; }

/* ── GUARDAR ── */
.btn-save { padding: 4px 10px; font-size: 11px; font-weight: 700; background: #3a7d44; color: #fff; border: none; border-radius: 5px; cursor: pointer; display: none; }
.btn-save.visible { display: inline-block; }
.btn-save:hover { background: #2d5a27; }
.save-fb { font-size: 10px; display: block; min-height: 14px; margin-top: 1px; }

/* ── ESTADOS CARGA ── */
.loading   { text-align: center; padding: 40px 20px; color: #9ca3af; }
.error-msg { background: #fef2f2; color: #dc2626; border-radius: 8px; padding: 12px 14px; margin: 12px 0; font-size: 13px; }
.flash { border-radius: 8px; padding: 8px 12px; margin-bottom: 10px; font-size: 12px; display: none; }
.flash.ok    { background: #f0fdf4; color: #15803d; }
.flash.error { background: #fef2f2; color: #dc2626; }

/* ── LOGIN ── */
#loginView { max-width: 360px; margin: 60px auto; background: #fff; border-radius: 14px; padding: 32px 24px; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,.08); }
#loginView h2 { font-size: 18px; color: #3a7d44; margin-bottom: 8px; }
#loginView p  { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
#pinInputStock { width: 160px; padding: 12px; font-size: 20px; text-align: center; letter-spacing: 6px; border: 1.5px solid #d1d5db; border-radius: 10px; margin-bottom: 12px; }
.btn-login { padding: 12px 28px; background: #3a7d44; color: #fff; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; }
.pin-error { color: #dc2626; font-size: 13px; margin-top: 8px; display: none; }

/* ── MOBILE ── */
@media (max-width: 580px) {
  .td-stock  { font-size: 16px; }
  .td-umbral, .td-piso { width: 58px; }
  .td-vel    { width: 52px; font-size: 10px; }
  .ov-input  { width: 44px; font-size: 11px; }
  .page-wrap { padding: 10px; }
  .var-table { font-size: 12px; }
  .td-save   { width: 70px; }
}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginView" style="display:none">
  <img src="https://escuela-dandelion.github.io/Comision-Recursos/Logo_Diente_de_Leon.png" alt="Logo" style="height:60px;margin-bottom:16px">
  <h2>Estado Inventario</h2>
  <p>Ingresá tu PIN para continuar</p>
  <input type="password" id="pinInputStock" inputmode="numeric" placeholder="••••"
    onkeydown="if(event.key==='Enter') validarPinStock()">
  <br>
  <button class="btn-login" onclick="validarPinStock()">Ingresar</button>
  <p class="pin-error" id="pinErrorStock">PIN incorrecto.</p>
</div>

<!-- MAIN -->
<div id="mainView" style="display:none">
  <div class="header">
    <a href="pedidos.html" style="text-decoration:none"><button class="btn-icon">‹</button></a>
    <img src="https://escuela-dandelion.github.io/Comision-Recursos/Logo_Diente_de_Leon.png" alt="Logo">
    <div style="flex:1">
      <h1>Estado Inventario</h1>
      <div class="header-meta" id="header-meta">Cargando…</div>
    </div>
    <button onclick="cargarDashboard()" class="btn-icon" title="Actualizar">↻</button>
  </div>

  <div class="page-wrap">
    <div class="flash" id="flash"></div>
    <div class="legend">
      <div class="legend-item"><span class="dot dot-rojo"></span> Alerta activa</div>
      <div class="legend-item"><span class="dot dot-amarillo"></span> Atención</div>
      <div class="legend-item"><span class="dot dot-verde"></span> OK</div>
      <div class="legend-sep"></div>
      <div class="last-update" id="last-update"></div>
    </div>
    <div id="dashContent"><div class="loading">Cargando inventario…</div></div>
  </div>
</div>

<script>
var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-SRI6_udFy4ktEoE4lABW8RbDNDZAQ8cfC6ZjGKonSI2BY6R_fQZMeVIAU5tEQlzGBQ/exec';
var PEDIDOS_URL = 'pedidos.html';
var PINES_VALIDOS = ['1234','2468','3579','1111','7531','8642','9753','4321','6543','2580'];

// ── AUTH ──────────────────────────────────────────────────
function checkAuth() {
  try { var s = JSON.parse(localStorage.getItem('dl_admin_session') || 'null'); if (s && s.role) return true; } catch(e) {}
  return false;
}
function validarPinStock() {
  var pin = document.getElementById('pinInputStock').value.trim();
  if (PINES_VALIDOS.indexOf(pin) !== -1) { localStorage.setItem('dl_stock_auth','1'); mostrarMain(); }
  else document.getElementById('pinErrorStock').style.display = 'block';
}
function mostrarMain() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('mainView').style.display = 'block';
  cargarDashboard();
}

// ── CARGA ─────────────────────────────────────────────────
var _dashData = null;
function cargarDashboard() {
  document.getElementById('dashContent').innerHTML = '<div class="loading">Cargando inventario…</div>';
  document.getElementById('header-meta').textContent = 'Actualizando…';
  fetch(SCRIPT_URL + '?action=getStockDashboard', { redirect: 'follow' })
    .then(function(r) { return r.json(); })
    .then(function(d) {
      if (!d.ok) throw new Error(d.error || 'Error desconocido');
      _dashData = d;
      renderDashboard(d);
      document.getElementById('last-update').textContent =
        'Actualizado ' + new Date().toLocaleTimeString('es-AR', { hour:'2-digit', minute:'2-digit' });
      document.getElementById('header-meta').textContent = d.diasActivos + ' días activos en ventana';
    })
    .catch(function(err) {
      document.getElementById('dashContent').innerHTML =
        '<div class="error-msg">No se pudo cargar el inventario. ' + err.message + '</div>';
      document.getElementById('header-meta').textContent = 'Error al cargar';
    });
}

// ── PRIORIDAD DE PRODUCTO ─────────────────────────────────
// 0 = rojo sin pedido (más urgente)
// 1 = rojo con pedido
// 2 = amarillo
// 3 = verde
function prodPrioridad(prod) {
  var semaforo = prod.variantes.reduce(function(w, v) {
    if (v.semaforo === 'rojo')                       return 'rojo';
    if (v.semaforo === 'amarillo' && w !== 'rojo')   return 'amarillo';
    return w;
  }, 'verde');
  var tienePedido = (prod.pedidos || []).length > 0;
  if (semaforo === 'rojo'     && !tienePedido) return 0;
  if (semaforo === 'rojo'     &&  tienePedido) return 1;
  if (semaforo === 'amarillo' && !tienePedido) return 2;
  if (semaforo === 'amarillo' &&  tienePedido) return 3;
  return 4;
}

// ── RENDER ────────────────────────────────────────────────
function renderDashboard(d) {
  var productos = d.productos.slice().sort(function(a, b) {
    return prodPrioridad(a) - prodPrioridad(b);
  });

  var html = '';
  productos.forEach(function(prod) {
    // Semáforo con stock en el header
    var semHtml = prod.variantes.map(function(v) {
      return '<div class="sem-item">' +
        '<span class="dot dot-' + v.semaforo + '"></span>' +
        '<span class="sem-stock stock-' + v.semaforo + '">' + v.stock + '</span>' +
      '</div>';
    }).join('');

    // Pedido badges
    var pedidosHtml = '';
    (prod.pedidos || []).forEach(function(p) {
      var est = (p.estado || '').toLowerCase().replace(/\s+/g, '-');
      var cls = est === 'en-camino' ? 'en-camino' : est === 'confirmado' ? 'confirmado' : 'solicitado';
      var emoji = est === 'en-camino' ? '🚚' : est === 'confirmado' ? '✅' : '📋';
      pedidosHtml +=
        '<a href="' + PEDIDOS_URL + '?id=' + p.norden + '" class="pedido-badge ' + cls + '" target="_blank">' +
        emoji + ' ' + p.norden + ' · ' + p.estado + '</a> ';
    });

    html +=
      '<div class="producto-card">' +
        '<div class="producto-header" onclick="toggleCard(\'' + prod.id + '\')">' +
          '<div class="semaforo-group">' + semHtml + '</div>' +
          '<div class="prod-info">' +
            '<div class="prod-nombre">' + esc(prod.nombre) + '</div>' +
            '<div class="prod-meta">' +
              (prod.fgp ? '<span class="prod-fgp">' + esc(prod.fgp) + '</span>' : '') +
              pedidosHtml +
            '</div>' +
          '</div>' +
          '<span class="chevron" id="chev-' + prod.id + '">▾</span>' +
        '</div>' +
        '<div class="variantes-wrap" id="vars-' + prod.id + '">' +
          renderTabla(prod) +
        '</div>' +
      '</div>';
  });

  if (!html) html = '<div class="loading">No hay productos con seguimiento de stock.</div>';
  document.getElementById('dashContent').innerHTML = html;
}

function renderTabla(prod) {
  var multiVar = prod.variantes.length > 1;
  var filas = prod.variantes.map(function(v) {
    var stockCls = 'stock-' + v.semaforo;
    var hasOvU   = v.umbralOverride !== null && v.umbralOverride !== undefined;
    var hasOvP   = v.pisoOverride   !== null && v.pisoOverride   !== undefined;

    return '<tr>' +
      '<td class="td-dot"><span class="dot dot-' + v.semaforo + '"></span></td>' +
      (multiVar ? '<td class="td-nombre">' + esc(v.nombre) + (v.sku ? '<div style="font-size:9px;color:#d1d5db;font-family:monospace;margin-top:1px;">' + esc(v.sku) + '</div>' : '') + '</td>' : '') +
      '<td class="td-alerta">' + (v.alertaEnviada ? '⚠️' : '') + '</td>' +
      '<td class="td-stock ' + stockCls + '">' + v.stock + '</td>' +
      '<td class="td-umbral">' +
        '<div class="ov-wrap" id="tipwrap-' + v.clave + '">' +
          '<input class="ov-input' + (hasOvU ? ' has-override' : '') + '" type="number" min="0"' +
            ' id="umb-' + v.clave + '"' +
            ' value="' + (hasOvU ? v.umbralOverride : '') + '"' +
            ' placeholder="' + v.umbralCalc + '"' +
            ' oninput="onOvChange(\'' + v.clave + '\')">' +
          '<button class="tip-btn" onclick="toggleTip(\'' + v.clave + '\',event)">i</button>' +
          '<div class="tip-box">' + umbralTip(v) + '</div>' +
        '</div>' +
      '</td>' +
      '<td class="td-piso">' +
        '<input class="ov-input' + (hasOvP ? ' has-override' : '') + '" type="number" min="0"' +
          ' id="piso-' + v.clave + '"' +
          ' value="' + (hasOvP ? v.pisoOverride : '') + '"' +
          ' placeholder="' + v.pisoMarca + '"' +
          ' oninput="onOvChange(\'' + v.clave + '\')">' +
      '</td>' +
      '<td class="td-vel th-vel">' + v.velocidad + ' u./mes</td>' +
      '<td class="td-save">' +
        '<button class="btn-save" id="btn-' + v.clave + '"' +
          ' onclick="guardarOverride(\'' + v.clave + '\',\'' + esc(v.nombre) + '\')">Guardar</button>' +
        '<span class="save-fb" id="fb-' + v.clave + '"></span>' +
      '</td>' +
    '</tr>';
  }).join('');

  return '<table class="var-table">' +
    '<thead><tr>' +
      '<th></th>' + (multiVar ? '<th>Variante</th>' : '') + '<th></th>' +
      '<th class="th-c">Stock</th>' +
      '<th class="th-c">Umbral</th>' +
      '<th class="th-c">Piso</th>' +
      '<th class="th-c th-vel">Vel/mes</th>' +
      '<th></th>' +
    '</tr></thead>' +
    '<tbody>' + filas + '</tbody>' +
  '</table>';
}

function umbralTip(v) {
  if (!v.velocidad)
    return 'Sin ventas registradas — se usa umbral por defecto de ' + v.umbralCalc + ' u.';
  var lead = v.leadTime || 14;
  return '📦 Se venden ~' + v.velocidad + ' u. por mes\n' +
    '🚚 El proveedor puede tardar hasta ~' + lead + ' días en entregar\n' +
    '⚠️ Hay que pedir cuando quedan ' + v.umbralCalc + ' u. — si esperás más, el stock se agota antes de que llegue el pedido';
}

// ── INTERACCIÓN ───────────────────────────────────────────
function toggleCard(id) {
  var wrap = document.getElementById('vars-' + id);
  var chev = document.getElementById('chev-' + id);
  var open = wrap.classList.contains('open');
  wrap.classList.toggle('open', !open);
  chev.classList.toggle('open', !open);
}

function onOvChange(clave) {
  var umbEl  = document.getElementById('umb-'  + clave);
  var pisoEl = document.getElementById('piso-' + clave);
  var btn    = document.getElementById('btn-'  + clave);
  umbEl.classList.toggle('has-override',  umbEl.value.trim()  !== '');
  pisoEl.classList.toggle('has-override', pisoEl.value.trim() !== '');
  btn.classList.add('visible');
}

function toggleTip(clave, e) {
  e.stopPropagation();
  var wrap   = document.getElementById('tipwrap-' + clave);
  var isOpen = wrap.classList.contains('tip-open');
  document.querySelectorAll('.ov-wrap.tip-open').forEach(function(el) { el.classList.remove('tip-open'); });
  if (!isOpen) {
    wrap.classList.add('tip-open');
    var btn  = e.currentTarget;
    var rect = btn.getBoundingClientRect();
    var box  = wrap.querySelector('.tip-box');
    var left = rect.left + rect.width / 2 - 100; // centrar los 200px
    left = Math.max(8, Math.min(left, window.innerWidth - 208));
    box.style.top  = (rect.bottom + 5) + 'px';
    box.style.left = left + 'px';
  }
}
document.addEventListener('click', function() {
  document.querySelectorAll('.ov-wrap.tip-open').forEach(function(el) { el.classList.remove('tip-open'); });
});

// ── GUARDAR OVERRIDE ──────────────────────────────────────
function guardarOverride(clave, nombre) {
  var umbVal  = document.getElementById('umb-'  + clave).value.trim();
  var pisoVal = document.getElementById('piso-' + clave).value.trim();
  var btn     = document.getElementById('btn-'  + clave);
  var fb      = document.getElementById('fb-'   + clave);
  btn.classList.remove('visible');
  fb.textContent = '…'; fb.style.color = '#9ca3af';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({
      action: 'saveStockOverride', clave: clave, nombre: nombre,
      umbralOverride: umbVal  !== '' ? parseInt(umbVal)  : null,
      pisoOverride:   pisoVal !== '' ? parseInt(pisoVal) : null
    })
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    fb.textContent = d.ok ? '✓ Guardado' : '✗ Error';
    fb.style.color = d.ok ? '#16a34a' : '#dc2626';
    if (d.ok) setTimeout(function() { fb.textContent = ''; }, 3000);
  })
  .catch(function() { fb.textContent = '✗'; fb.style.color = '#dc2626'; btn.classList.add('visible'); });
}

function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
}

// ── INIT ──────────────────────────────────────────────────
(function() {
  var params = new URLSearchParams(window.location.search);
  if (params.get('auth') === '1') {
    document.getElementById('loginView').style.display = 'none';
    document.querySelector('.header').style.display = 'none';
    document.getElementById('mainView').style.display = 'block';
    cargarDashboard();
    return;
  }
  if (checkAuth() || localStorage.getItem('dl_stock_auth') === '1') mostrarMain();
  else document.getElementById('loginView').style.display = 'block';
})();
</script>
</body>
</html>
