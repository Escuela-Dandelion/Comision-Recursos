<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ventas a Pedido — Diente de León</title>
  <style>
    :root {
      --green:       #3a7d44;
      --green-light: #e8f5e9;
      --green-mid:   #c8e6c9;
      --amber:       #f59e0b;
      --amber-light: #fef3c7;
      --blue:        #1976d2;
      --blue-light:  #e3f2fd;
      --red:         #c62828;
      --text:        #1a1a2e;
      --muted:       #6b7280;
      --border:      #e0e0e0;
      --bg:          #f7f8fa;
      --card:        #ffffff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, 'Segoe UI', system-ui, sans-serif; font-size: 14px; color: var(--text); background: var(--bg); padding-bottom: 80px; }

    /* ── Filtros ── */
    .filter-bar {
      position: sticky; top: 0; z-index: 20;
      background: var(--card); border-bottom: 1px solid var(--border);
      padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .filter-bar label { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .filter-bar input[type="date"] {
      border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px;
      font-size: 13px; color: var(--text); background: #fff;
    }
    .btn-buscar {
      background: var(--green); color: #fff; border: none; border-radius: 6px;
      padding: 6px 14px; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .btn-buscar:hover { background: #2e6636; }
    .loading-msg { font-size: 12px; color: var(--muted); }

    /* ── Contenido ── */
    .content { padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .empty-msg { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 13px; }

    /* ── Grupo proveedor ── */
    .grupo { background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .grupo-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; cursor: pointer; user-select: none;
      border-bottom: 1px solid var(--border); background: #fafafa;
      transition: background 0.15s;
    }
    .grupo-header:hover { background: var(--green-light); }
    .grupo-header-left { display: flex; align-items: center; gap: 10px; }
    .grupo-nombre { font-weight: 700; font-size: 14px; }
    .grupo-meta { font-size: 11px; color: var(--muted); }
    .grupo-arrow { font-size: 12px; color: var(--muted); transition: transform 0.2s; }
    .grupo.collapsed .grupo-arrow { transform: rotate(-90deg); }
    .grupo.collapsed .grupo-body { display: none; }
    .check-all-wrap { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }

    /* ── Tabla ── */
    .grupo-body { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: #f8f9fa; color: var(--muted); font-size: 11px; font-weight: 600;
      padding: 7px 10px; text-align: left; white-space: nowrap;
      border-bottom: 1px solid var(--border); letter-spacing: 0.2px;
    }
    tbody tr { border-bottom: 1px solid #f0f0f0; transition: background 0.1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:hover { background: #f0f7ff; }
    tbody tr.selected { background: #e8f5e9; }
    td { padding: 8px 10px; vertical-align: middle; }
    .col-check { width: 36px; text-align: center; }
    .col-fecha { white-space: nowrap; color: var(--muted); font-size: 12px; }
    .col-pedido { font-size: 12px; font-weight: 600; color: var(--green); white-space: nowrap; }
    .col-producto { max-width: 180px; }
    .col-producto-sku { font-size: 11px; color: var(--muted); font-family: monospace; margin-top: 2px; }
    .col-num { text-align: right; white-space: nowrap; }
    .col-num.cant { font-weight: 600; }
    input[type="checkbox"] { width: 15px; height: 15px; cursor: pointer; accent-color: var(--green); }

    /* ── Pill pedido (mismos colores que Gestión de Productos) ── */
    .pedido-badge { display: inline-flex; align-items: center; gap: 3px; border-radius: 100px; font-size: 10px; font-weight: 700; padding: 2px 8px; white-space: nowrap; border: 1px solid; margin-top: 4px; cursor: pointer; text-decoration: none; }
    .pedido-badge.solicitado { background: #fff8e1; color: #b45309; border-color: #fcd34d; }
    .pedido-badge.confirmado { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
    .pedido-badge.en-camino  { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
    .pedido-badge.entregado  { background: #fff7ed; color: #c2410c; border-color: #fed7aa; }
    .pedido-badge.recibido   { background: #f0fdf4; color: #166534; border-color: #86efac; }

    /* ── Barra flotante ── */
    .bottom-bar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 30;
      background: var(--text); color: #fff;
      padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;
      transform: translateY(100%); transition: transform 0.25s ease;
    }
    .bottom-bar.visible { transform: translateY(0); }
    .bottom-bar-info { font-size: 13px; }
    .bottom-bar-info strong { font-size: 15px; }
    .btn-generar {
      background: var(--green); color: #fff; border: none; border-radius: 7px;
      padding: 9px 18px; font-size: 13px; font-weight: 700; cursor: pointer;
      white-space: nowrap; flex-shrink: 0;
    }
    .btn-generar:hover { background: #2e6636; }
    .btn-generar:disabled { background: #555; cursor: not-allowed; }
    .warn-multi { color: #fca5a5; font-size: 12px; }
    .contact-btn-vss { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; border:1.5px solid #d1d5db; background:#fff; cursor:pointer; text-decoration:none; vertical-align:middle; flex-shrink:0; transition:background .15s; }
    .contact-btn-vss:hover { background:#f3f4f6; }
    .contact-email-txt-vss { font-size:10px; color:#9ca3af; margin-top:2px; cursor:text; user-select:all; -webkit-user-select:all; }
  </style>
</head>
<body>
<div id="auth-msg" style="display:none;padding:40px;text-align:center;color:#6b7280;font-size:14px">
  Necesitás iniciar sesión. Podés hacerlo desde <a href="pedidos.html" style="color:#2d5a27">Pedidos</a>.
</div>

  <div class="filter-bar">
    <label>Desde <input type="date" id="f-desde"></label>
    <label>Hasta <input type="date" id="f-hasta"></label>
    <button class="btn-buscar" onclick="cargar()">Buscar</button>
    <span class="loading-msg" id="loading-msg" style="display:none">Cargando…</span>
  </div>

  <div class="content" id="content">
    <div class="empty-msg">Seleccioná un rango de fechas y hacé clic en Buscar.</div>
  </div>

  <div class="bottom-bar" id="bottom-bar">
    <div class="bottom-bar-info">
      <div id="bar-info">0 ítems seleccionados</div>
      <div id="bar-warn" class="warn-multi" style="display:none"></div>
    </div>
    <button class="btn-generar" id="btn-generar" onclick="generarPedido()">📋 Generar Pedido a Proveedor</button>
  </div>

<script src="ddl-utils.js"></script>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbz-SRI6_udFy4ktEoE4lABW8RbDNDZAQ8cfC6ZjGKonSI2BY6R_fQZMeVIAU5tEQlzGBQ/exec';

  // Auth: email desde URL param (inyectado por admin.html al impersonar) o desde sesión
  var _urlEmail = (new URLSearchParams(window.location.search)).get('email') || '';
  var _userEmail = _urlEmail || ddlGetEmail();
  if (!_userEmail) {
    document.getElementById('auth-msg').style.display = 'block';
    document.querySelector('.filter-bar').style.display = 'none';
    document.getElementById('content').style.display = 'none';
  }

  // Fechas default: último jueves → hoy
  // Ventas anteriores con pedido vigente se incluyen igual (lógica en el GAS)
  (function() {
    if (!_userEmail) return;
    var hoy = new Date();
    var diasDesdeJueves = (hoy.getDay() + 7 - 4) % 7;
    var ultimoJueves = new Date(hoy);
    ultimoJueves.setDate(hoy.getDate() - diasDesdeJueves);
    document.getElementById('f-desde').value = ultimoJueves.toISOString().split('T')[0];
    document.getElementById('f-hasta').value = hoy.toISOString().split('T')[0];
    cargar();
  })();

  function fmt(n) {
    return '$' + Math.round(n).toLocaleString('es-AR');
  }

  // ── Cargar datos ───────────────────────────────────────────────────────────
  function cargar() {
    var desde = document.getElementById('f-desde').value;
    var hasta = document.getElementById('f-hasta').value;
    var msg   = document.getElementById('loading-msg');
    var cont  = document.getElementById('content');
    msg.style.display = 'inline';
    cont.innerHTML = '';

    fetch(GAS_URL + '?action=getVentasSinStock&desde=' + encodeURIComponent(desde) + '&hasta=' + encodeURIComponent(hasta) + '&email=' + encodeURIComponent(_userEmail), { redirect: 'follow' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        msg.style.display = 'none';
        if (!data.ok) { cont.innerHTML = '<div class="empty-msg">Error: ' + (data.error || 'respuesta inesperada') + '</div>'; return; }
        var grupos = data.grupos || {};
        if (!Object.keys(grupos).length) {
          cont.innerHTML = '<div class="empty-msg">No hay ventas a pedido pendientes en ese período.</div>';
          return;
        }
        renderGrupos(grupos);
      })
      .catch(function(err) {
        msg.style.display = 'none';
        cont.innerHTML = '<div class="empty-msg">Error al cargar: ' + err.message + '</div>';
      });
  }

  // ── Render ─────────────────────────────────────────────────────────────────
  function renderGrupos(grupos) {
    var cont = document.getElementById('content');
    cont.innerHTML = '';
    Object.keys(grupos).sort().forEach(function(prov) {
      var lineas    = grupos[prov];
      // sin pedido primero, vigente después
      lineas.sort(function(a, b) {
        return (a.estadoPedido ? 1 : 0) - (b.estadoPedido ? 1 : 0);
      });
      var totalCosto = lineas.reduce(function(s, l) { return s + (l.costo * l.cantidad); }, 0);
      var totalUnid  = lineas.reduce(function(s, l) { return s + l.cantidad; }, 0);

      var div = document.createElement('div');
      div.className = 'grupo';
      div.dataset.prov = prov;

      div.innerHTML =
        '<div class="grupo-header" onclick="toggleGrupo(\'' + esc(prov) + '\')">' +
          '<div class="grupo-header-left">' +
            '<div class="check-all-wrap">' +
              '<input type="checkbox" class="prov-check-all" data-prov="' + esc(prov) + '" onclick="event.stopPropagation();toggleTodos(\'' + esc(prov) + '\',this.checked)">' +
            '</div>' +
            '<div>' +
              '<div class="grupo-nombre">' + esc(prov) + '</div>' +
              '<div class="grupo-meta">' + totalUnid + ' unidades · ' + fmt(totalCosto) + ' en costos</div>' +
            '</div>' +
          '</div>' +
          '<span class="grupo-arrow">▼</span>' +
        '</div>' +
        '<div class="grupo-body">' +
          '<table>' +
            '<thead><tr>' +
              '<th class="col-check"></th>' +
              '<th>Fecha</th><th>Pedido</th><th>Comprador</th>' +
              '<th>Producto</th>' +
              '<th class="col-num">Cant.</th>' +
              '<th class="col-num">Costo unit.</th>' +
              '<th class="col-num">Subtotal</th>' +
            '</tr></thead>' +
            '<tbody>' + lineas.map(function(l, idx) {
              return '<tr data-prov="' + esc(prov) + '">' +
                '<td class="col-check">' +
                  '<input type="checkbox" class="item-check"' +
                  ' data-prov="' + esc(prov) + '"' +
                  ' data-sku="' + esc(l.sku) + '"' +
                  ' data-nombre="' + esc(l.producto) + '"' +
                  ' data-cantidad="' + l.cantidad + '"' +
                  ' data-costo="' + l.costo + '"' +
                  (l.estadoPedido ? ' data-con-pedido="1"' : '') +
                  ' onchange="onSeleccionCambio()">' +
                '</td>' +
                '<td class="col-fecha">' + l.fecha + '</td>' +
                '<td class="col-pedido">#' + l.pedido + '</td>' +
                '<td style="white-space:nowrap"><strong>' + esc(l.comprador) + '</strong>' + contactBtnsVSS(l.email, l.phone, l.pedido) + emailTxtVSS(l.email) + '</td>' +
                '<td class="col-producto">' +
                  esc(l.producto) +
                  '<div class="col-producto-sku">' + esc(l.sku) + '</div>' +
                  (l.estadoPedido ? ordenPillHtml(l.norden, l.estadoPedido) : '') +
                '</td>' +
                '<td class="col-num cant">' + l.cantidad + '</td>' +
                '<td class="col-num">' + (l.costo ? fmt(l.costo) : '—') + '</td>' +
                '<td class="col-num">' + (l.costo ? fmt(l.costo * l.cantidad) : '—') + '</td>' +
              '</tr>';
            }).join('') +
            '</tbody>' +
          '</table>' +
        '</div>';

      cont.appendChild(div);
    });
  }

  function esc(s) {
    return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  var _WA_ICON_VSS = '<svg width="14" height="14" viewBox="0 0 24 24" fill="#25D366"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>';
  var _EMAIL_ICON_VSS = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>';
  function contactBtnsVSS(email, phone, pedido) {
    var msg = '\uD83C\uDF3C Hola, te escribo de la Tienda Diente de León por tu pedido' + (pedido ? ' #' + pedido : '') + '.';
    var btns = '';
    if (email) {
      var subj = 'Tienda Diente de León' + (pedido ? ' - Pedido #' + pedido : '');
      var gmailUrl = 'https://mail.google.com/mail/?view=cm&to=' + encodeURIComponent(email) + '&su=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(msg);
      btns += '<a href="' + gmailUrl + '" target="_blank" title="' + esc(email) + '" class="contact-btn-vss">' + _EMAIL_ICON_VSS + '</a>';
    }
    if (phone) {
      var n = phone.replace(/\D/g, '');
      if (n.substring(0, 2) !== '54') n = '54' + (n.charAt(0) === '0' ? n.slice(1) : n);
      btns += '<a href="https://wa.me/' + n + '?text=' + encodeURIComponent(msg) + '" target="_blank" title="Escribir por WhatsApp" class="contact-btn-vss">' + _WA_ICON_VSS + '</a>';
    }
    return btns ? '<span style="display:inline-flex;gap:3px;margin-left:5px;vertical-align:middle">' + btns + '</span>' : '';
  }
  function emailTxtVSS(email) {
    return email ? '<div class="contact-email-txt-vss">' + esc(email) + '</div>' : '';
  }

  function ordenPillHtml(norden, estado) {
    if (!estado) return '';
    var est = (estado === 'vigente' ? 'solicitado' : estado).toLowerCase().replace(/\s+/g, '-');
    var cls = est === 'en-camino'            ? 'en-camino'
            : est === 'confirmado'           ? 'confirmado'
            : est === 'entregado-en-escuela' ? 'entregado'
            : est === 'recibido'             ? 'recibido'
            : est === 'en-proceso'           ? 'en-camino'
            : 'solicitado';
    var emoji = est === 'en-camino'            ? '🚚'
              : est === 'confirmado'           ? '✅'
              : est === 'entregado-en-escuela' ? '🏫'
              : est === 'recibido'             ? '📦'
              : '📋';
    var label = norden ? (esc(norden) + ' · ' + esc(estado)) : esc(estado);
    var href  = norden ? 'href="pedidos.html?id=' + esc(norden) + '"' : '';
    return '<a class="pedido-badge ' + cls + '" ' + href + '>' + emoji + ' ' + label + '</a>';
  }

  // ── Expandir / colapsar ────────────────────────────────────────────────────
  function toggleGrupo(prov) {
    var div = document.querySelector('.grupo[data-prov="' + prov + '"]');
    if (div) div.classList.toggle('collapsed');
  }

  function toggleTodos(prov, checked) {
    document.querySelectorAll('.item-check[data-prov="' + prov + '"]').forEach(function(cb) {
      // Al marcar "todos": solo selecciona ventas sin pedido asignado
      // Al desmarcar: limpia todo
      if (checked && cb.dataset.conPedido) return;
      cb.checked = checked;
      cb.closest('tr').classList.toggle('selected', checked);
    });
    onSeleccionCambio();
  }

  // ── Selección ──────────────────────────────────────────────────────────────
  function onSeleccionCambio() {
    var seleccionados = Array.from(document.querySelectorAll('.item-check:checked'));
    var bar  = document.getElementById('bottom-bar');
    var info = document.getElementById('bar-info');
    var warn = document.getElementById('bar-warn');
    var btn  = document.getElementById('btn-generar');

    // actualizar color de fila
    document.querySelectorAll('.item-check').forEach(function(cb) {
      cb.closest('tr').classList.toggle('selected', cb.checked);
    });

    // sincronizar checkbox "todos" — refleja solo las ventas sin pedido asignado
    document.querySelectorAll('.prov-check-all').forEach(function(allCb) {
      var prov        = allCb.dataset.prov;
      var sinPedido   = document.querySelectorAll('.item-check[data-prov="' + prov + '"]:not([data-con-pedido])');
      var marcados    = document.querySelectorAll('.item-check[data-prov="' + prov + '"]:not([data-con-pedido]):checked');
      allCb.indeterminate = marcados.length > 0 && marcados.length < sinPedido.length;
      allCb.checked = sinPedido.length > 0 && marcados.length === sinPedido.length;
    });

    if (!seleccionados.length) {
      bar.classList.remove('visible');
      return;
    }

    var provs   = new Set(seleccionados.map(function(cb) { return cb.dataset.prov; }));
    var unidades = seleccionados.reduce(function(s, cb) { return s + parseInt(cb.dataset.cantidad); }, 0);
    var totalCosto = seleccionados.reduce(function(s, cb) { return s + parseFloat(cb.dataset.costo) * parseInt(cb.dataset.cantidad); }, 0);

    info.textContent = seleccionados.length + ' líneas · ' + unidades + ' unidades · ' + fmt(totalCosto) + ' en costos';

    if (provs.size > 1) {
      warn.textContent = '⚠ Seleccionaste productos de ' + provs.size + ' proveedores. Solo podés generar un pedido por proveedor.';
      warn.style.display = 'block';
      btn.disabled = true;
    } else {
      warn.style.display = 'none';
      btn.disabled = false;
    }

    bar.classList.add('visible');
  }

  // ── Generar pedido ─────────────────────────────────────────────────────────
  function generarPedido() {
    var seleccionados = Array.from(document.querySelectorAll('.item-check:checked'));
    if (!seleccionados.length) return;

    var provs = new Set(seleccionados.map(function(cb) { return cb.dataset.prov; }));
    if (provs.size > 1) return;

    var proveedor = Array.from(provs)[0];

    // Agregar por SKU (suma cantidades del mismo SKU)
    var agregado = {};
    seleccionados.forEach(function(cb) {
      var sku = cb.dataset.sku;
      if (!agregado[sku]) {
        agregado[sku] = {
          nombre:   cb.dataset.nombre,
          sku:      sku,
          cantidad: 0,
          costo:    parseFloat(cb.dataset.costo) || 0
        };
      }
      agregado[sku].cantidad += parseInt(cb.dataset.cantidad);
    });

    var draft = {
      proveedor: proveedor,
      productos: Object.values(agregado)
    };

    localStorage.setItem('ddl_pedido_draft', JSON.stringify(draft));
    window.location.href = 'orden-de-pedido.html?proveedor=' + encodeURIComponent(proveedor);
  }
</script>

</body>
</html>
