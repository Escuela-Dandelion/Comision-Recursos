<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <script>(function(){var V='20261105';if(location.search.indexOf('appv='+V)===-1){var p=new URLSearchParams(location.search);p.set('appv',V);location.replace(location.pathname+'?'+p.toString()+(location.hash||''));}})()</script>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Referentes — Diente de León</title>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f4f6f9; color: #1a1a1a; }

    /* ── LOGIN ── */
    #login { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:24px; }
    .login-card {
      background:#fff; border-radius:20px; padding:40px 32px; width:100%; max-width:360px;
      box-shadow:0 4px 24px rgba(0,0,0,.08); text-align:center;
    }
    .login-card img  { max-width:140px; margin-bottom:28px; }
    .login-card h2   { font-size:20px; color:#1a1a6e; margin-bottom:6px; }
    .login-card p    { font-size:14px; color:#888; margin-bottom:28px; }
    .login-card input {
      width:100%; padding:16px; border:1.5px solid #e0e0e0; border-radius:12px;
      font-size:22px; text-align:center; letter-spacing:6px; margin-bottom:12px;
      outline:none; transition:border-color .2s;
    }
    .login-card input:focus { border-color:#1a1a6e; }
    .login-card button {
      width:100%; padding:16px; background:#1a1a6e; color:#fff; border:none;
      border-radius:12px; font-size:16px; font-weight:600; cursor:pointer;
    }
    .login-card button:hover    { background:#2d2d8e; }
    .login-card button:disabled { background:#aaa; cursor:not-allowed; }
    #login-error { color:#e63946; font-size:13px; margin-top:10px; display:none; }

    /* ── LAYOUT ── */
    #dashboard { display:none; height:100vh; flex-direction:column; }
    .topbar {
      background:#fff; border-bottom:1px solid #eee; padding:12px 20px;
      display:flex; align-items:center; justify-content:space-between; flex-shrink:0;
    }
    .topbar img      { height:34px; }
    .topbar-info h1  { font-size:15px; color:#1a1a6e; font-weight:700; }
    .topbar-info p   { font-size:11px; color:#aaa; }
    .topbar-actions  { display:flex; align-items:center; gap:8px; }
    .topbar-btn {
      background:none; border:1px solid #ddd; border-radius:8px;
      padding:6px 14px; font-size:13px; cursor:pointer; color:#555;
      text-decoration:none; display:inline-flex; align-items:center; gap:5px;
    }
    .topbar-btn:hover { background:#f4f6f9; }
    .topbar-btn.primary { background:#1a1a6e; color:#fff; border-color:#1a1a6e; }
    .topbar-btn.primary:hover { background:#2d2d8e; }
    .topbar-btn.pdf { background:#2e7d32; color:#fff; border-color:#2e7d32; }
    .topbar-btn.pdf:hover { background:#1b5e20; }
    #ver-como-wrap { display:none; align-items:center; gap:6px; font-size:12px; color:#6b7280; }
    #ver-como-select { font-size:12px; padding:4px 8px; border:1px solid #d1d5db; border-radius:6px; background:#fff; color:#374151; cursor:pointer; max-width:220px; }
    #imp-banner-ref { display:none; align-items:center; gap:10px; background:#fffbeb; border-bottom:1px solid #fcd34d; padding:8px 20px; font-size:13px; color:#92400e; }
    #imp-banner-ref button { font-size:12px; padding:3px 10px; border:1px solid #fcd34d; border-radius:6px; background:#fff; cursor:pointer; color:#92400e; }
    .contact-btn { display:inline-flex; align-items:center; justify-content:center; width:26px; height:26px; border-radius:50%; border:1.5px solid #d1d5db; background:#fff; cursor:pointer; text-decoration:none; vertical-align:middle; flex-shrink:0; transition:background .15s; }
    .contact-btn:hover { background:#f3f4f6; }
    .contact-email-txt { font-size:11px; color:#9ca3af; margin-top:3px; cursor:text; user-select:all; -webkit-user-select:all; }

    .body-layout { display:flex; flex:1; overflow:hidden; }

    /* ── SIDEBAR ── */
    .sidebar {
      width:220px; background:#fff; border-right:1px solid #eee;
      overflow-y:auto; flex-shrink:0; padding:20px 0;
    }
    .sidebar-logo { padding:0 16px 20px; border-bottom:1px solid #f0f0f0; margin-bottom:16px; }
    .sidebar-logo img { max-width:120px; }
    .sidebar-section  { padding:0 16px 8px; }
    .sidebar-label    { font-size:10px; font-weight:700; color:#bbb; text-transform:uppercase; letter-spacing:1px; margin-bottom:8px; }
    .sidebar-divider  { border:none; border-top:1px solid #f0f0f0; margin:12px 0; }
    .filter-label  { font-size:12px; color:#888; margin-bottom:6px; padding:0 16px; }
    .filter-select {
      width:calc(100% - 32px); margin:0 16px 12px; padding:8px 10px;
      border:1px solid #e0e0e0; border-radius:8px; font-size:13px;
      background:#fff; cursor:pointer; outline:none;
    }
    .filter-select:focus { border-color:#1a1a6e; }
    .filter-date {
      width:calc(100% - 32px); margin:0 16px 12px; padding:7px 10px;
      border:1px solid #e0e0e0; border-radius:8px; font-size:12px;
      background:#fff; outline:none; color:#333;
    }
    .filter-date:focus { border-color:#1a1a6e; }
    .filter-clear-dates {
      display:block; width:calc(100% - 32px); margin:0 16px 12px;
      padding:6px 10px; border:1px solid #e0e0e0; border-radius:8px;
      font-size:11px; color:#999; background:#fafafa; cursor:pointer;
      text-align:center;
    }
    .filter-clear-dates:hover { background:#f0f0f0; color:#666; }
    .grado-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:9px 12px; margin:0 8px 2px; border-radius:10px;
      cursor:pointer; font-size:13px; color:#555; transition:background .15s;
    }
    .grado-item:hover  { background:#f4f6f9; }
    .grado-item.active { background:#f0f2ff; color:#1a1a6e; font-weight:600; }
    .grado-badge { background:#e8eaff; color:#1a1a6e; border-radius:10px; padding:1px 7px; font-size:10px; font-weight:700; }
    .grado-item.active .grado-badge { background:#1a1a6e; color:#fff; }

    /* ── MAIN ── */
    .main { flex:1; overflow-y:auto; padding:24px; }
    #loading-dash { text-align:center; padding:80px; color:#aaa; font-size:15px; }
    .empty-state { text-align:center; padding:60px 20px; color:#bbb; }
    .empty-state .icon { font-size:48px; margin-bottom:12px; }

    /* Header de grado */
    .grado-header {
      background:#fff; border-radius:12px; border:1px solid #eee;
      padding:18px 20px; margin-bottom:20px;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
    }
    .grado-titulo    { font-size:20px; font-weight:700; color:#1a1a6e; }
    .grado-subtitulo { font-size:13px; color:#aaa; margin-top:2px; }
    .grado-total     { font-size:22px; font-weight:700; color:#2e7d32; }

    /* Cards */
    .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:24px; }
    .card {
      background:#fff; border-radius:10px; padding:12px 14px;
      border:1px solid #e8eaed; border-left:3px solid #c0c4cc;
      box-shadow:0 1px 3px rgba(0,0,0,.04);
    }
    .card-label { font-size:9px; font-weight:700; color:#888; text-transform:uppercase; letter-spacing:.8px; margin-bottom:6px; }
    .card-value { font-size:20px; font-weight:700; color:#333; line-height:1; }
    .card-sub   { font-size:10px; color:#aaa; margin-top:4px; }

    .card.purple { border-left-color:#7c3aed; background:#faf5ff; }
    .card.purple .card-label { color:#7c3aed; }
    .card.purple .card-value { color:#7c3aed; }

    .card.teal { border-left-color:#0891b2; background:#f0f9ff; }
    .card.teal .card-label { color:#0891b2; }
    .card.teal .card-value { color:#0891b2; }

    .card.green { border-left-color:#059669; background:#f0fdf4; }
    .card.green .card-label { color:#059669; }
    .card.green .card-value { color:#059669; }

    .card.orange { border-left-color:#d97706; background:#fffbeb; }
    .card.orange .card-label { color:#d97706; }
    .card.orange .card-value { color:#d97706; }

    /* View toggle */
    .view-toggle { display:flex; gap:0; border:1px solid #e0e0e0; border-radius:8px; overflow:hidden; margin-bottom:20px; width:fit-content; }
    .view-btn {
      padding:8px 18px; font-size:13px; cursor:pointer; border:none;
      background:#fff; color:#555; font-weight:500; transition:background .15s;
    }
    .view-btn:hover { background:#f4f6f9; }
    .view-btn.active { background:#1a1a6e; color:#fff; }
    .view-btn + .view-btn { border-left:1px solid #e0e0e0; }

    /* Section card */
    .section-card { background:#fff; border-radius:12px; border:1px solid #eee; margin-bottom:20px; overflow:hidden; }
    .section-head { padding:14px 18px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
    .section-title { font-size:14px; font-weight:700; color:#1a1a6e; }
    .section-title span { font-size:12px; font-weight:400; color:#aaa; margin-left:6px; }
    .section-count { font-size:11px; color:#aaa; }

    /* Badges */
    .badge-pesos { background:#e6f7ee; color:#00A650; border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }
    .badge-units { background:#f0f0f0; color:#555; border-radius:20px; padding:3px 10px; font-size:11px; }
    .arrow { font-size:10px; color:#bbb; transition:transform .2s; display:inline-block; flex-shrink:0; }
    .arrow.open { transform:rotate(90deg); }

    /* ── VISTA POR FAMILIA ── */
    .fam-row {
      padding:13px 18px; display:flex; align-items:center; justify-content:space-between;
      cursor:pointer; border-bottom:1px solid #eef0ff; user-select:none;
      background:#f7f8ff; transition:background .15s;
    }
    .fam-row:hover { background:#eef0ff; }
    .fam-left { display:flex; align-items:center; gap:10px; }
    .fam-name  { font-weight:700; font-size:14px; color:#1a1a6e; }
    .fam-email { font-size:11px; color:#aaa; }
    .fam-right { display:flex; align-items:center; gap:8px; }
    .fam-body  { display:none; background:#fff; border-bottom:1px solid #eee; overflow-x:auto; }
    .fam-body.open { display:block; }

    /* ── SECCIONES POR GRADO (vista familia) ── */
    .grade-sec-row {
      padding:10px 18px; display:flex; align-items:center; gap:10px;
      cursor:pointer; background:#eaecff; border-top:1px solid #d0d5f5;
      border-bottom:1px solid #c8ccf0; user-select:none; transition:background .15s;
    }
    .grade-sec-row:hover { background:#dde1ff; }
    .grade-sec-name  { font-weight:700; font-size:13px; color:#1a1a6e; flex:1; }
    .grade-sec-count { font-size:11px; color:#666; }
    .grade-sec-body  { display:none; }
    .grade-sec-body.open { display:block; }

    /* ── VISTA POR PRODUCTO ── */
    .prod-row {
      padding:13px 18px; display:flex; align-items:center; justify-content:space-between;
      cursor:pointer; border-bottom:1px solid #eef4ee; user-select:none;
      background:#f7fff8; transition:background .15s;
    }
    .prod-row:hover { background:#edf7ee; }
    .prod-left  { display:flex; align-items:center; gap:10px; }
    .prod-name  { font-weight:700; font-size:14px; color:#1b5e20; }
    .prod-marca { font-size:11px; color:#aaa; }
    .prod-right { display:flex; align-items:center; gap:8px; }
    .prod-body  { display:none; background:#fff; border-bottom:1px solid #eee; overflow-x:auto; }
    .prod-body.open { display:block; }
    .badge-units-g { background:#e8f5e9; color:#2e7d32; border-radius:20px; padding:3px 10px; font-size:11px; font-weight:700; }

    /* Tablas internas */
    table.tbl-inner { width:100%; border-collapse:collapse; font-size:12px; }
    table.tbl-inner th {
      padding:8px 14px 8px 48px; text-align:left; font-size:10px;
      text-transform:uppercase; color:#bbb; border-bottom:1px solid #eee;
      font-weight:600; white-space:nowrap;
    }
    table.tbl-inner th.num { text-align:right; padding-left:8px; }
    table.tbl-inner td { padding:10px 14px 10px 48px; border-bottom:1px solid #f5f5f5; vertical-align:middle; }
    table.tbl-inner td.num { text-align:right; padding-left:8px; font-variant-numeric:tabular-nums; white-space:nowrap; }
    table.tbl-inner tr:last-child td { border-bottom:none; }
    table.tbl-inner tr:hover td { background:#fafafa; }
    .chip { background:#f0f2ff; color:#1a1a6e; border-radius:8px; padding:2px 7px; font-size:10px; }
    .chip-g { background:#e8f5e9; color:#2e7d32; border-radius:8px; padding:2px 7px; font-size:10px; }
    .txt-sm { font-size:11px; color:#aaa; white-space:nowrap; }

    /* ── MOBILE ── */
    @media (max-width:700px) {
      /* Topbar: logo + botones compactos, título oculto */
      .topbar { padding:8px 12px; flex-wrap:nowrap; gap:6px; }
      .topbar img { height:30px; flex-shrink:0; }
      .topbar-info { display:none; }
      .topbar-actions { gap:6px; }
      .topbar-btn { padding:6px 10px; font-size:12px; gap:3px; }

      /* Sidebar → columna compacta */
      .body-layout { flex-direction:column; }
      .sidebar {
        width:100%; border-right:none; border-bottom:1px solid #eee;
        padding:10px 0 0; overflow:hidden; flex-shrink:0;
      }
      .sidebar-logo    { display:none; }
      .sidebar-divider { display:none; }
      .sidebar-section { padding:0 14px 4px; }
      .sidebar-label   { font-size:9px; }

      /* Filtros: ancho completo */
      .filter-label  { padding:0 14px; font-size:11px; }
      .filter-select { width:calc(100% - 28px); margin:0 14px 10px; }
      .filter-date   { width:calc(100% - 28px); margin:0 14px 10px; }
      .filter-clear-dates { width:calc(100% - 28px); margin:0 14px 10px; }

      /* Grados → chips horizontales scrolleables */
      #grados-nav {
        display:flex !important;
        flex-direction:row !important;
        flex-wrap:nowrap;
        gap:6px;
        padding:6px 14px 12px;
        overflow-x:auto;
        overflow-y:hidden;
        -webkit-overflow-scrolling:touch;
        scrollbar-width:none;
      }
      #grados-nav::-webkit-scrollbar { display:none; }
      .grado-item {
        flex-shrink:0 !important;
        white-space:nowrap;
        padding:6px 12px !important;
        margin:0 !important;
        border-radius:20px !important;
        border:1.5px solid #ddd;
        background:#fff;
        font-size:12px;
        width:auto !important;
        justify-content:center;
      }
      .grado-item.active { background:#1a1a6e; border-color:#1a1a6e; color:#fff; }
      .grado-item.active .grado-badge { background:rgba(255,255,255,.2); color:#fff; }
      .grado-badge { font-size:10px; padding:1px 5px; }

      /* Main y cards */
      .main { padding:12px; }
      .cards { grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px; }
      .card  { padding:10px 12px; }
      .card-value { font-size:18px; }
      .card-label { font-size:9px; }

      /* Vista toggle */
      .view-toggle { width:100%; margin-bottom:14px; }
      .view-btn { flex:1; justify-content:center; }

      /* Header grado */
      .grado-header { padding:12px 14px; gap:8px; }
      .grado-titulo { font-size:16px; }
      .grado-total  { font-size:18px; }

      /* Tablas */
      table.tbl-inner th, table.tbl-inner td { padding-left:14px; }
      table.tbl-inner th { font-size:9px; }
      .fam-row, .prod-row { padding:11px 14px; }
      .fam-name, .prod-name { font-size:13px; }
    }

    /* ── PRINT / PDF ── */
    #print-area { display:none; }

    @media print {
      * { -webkit-print-color-adjust:exact; print-color-adjust:exact; }
      body { background:#fff !important; }
      #login, #dashboard { display:none !important; }
      #print-area {
        display:block !important;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color:#1a1a1a; padding:24px; font-size:12px;
      }

      .print-header {
        display:flex; align-items:center; justify-content:space-between;
        border-bottom:2px solid #1a1a6e; padding-bottom:14px; margin-bottom:20px;
      }
      .print-header img { height:50px; }
      .print-header-info h1 { font-size:18px; font-weight:700; color:#1a1a6e; }
      .print-header-info p  { font-size:11px; color:#666; margin-top:3px; }
      .print-header-date    { font-size:11px; color:#999; text-align:right; }

      .print-section { margin-bottom:28px; }
      .print-section-title {
        font-size:13px; font-weight:700; color:#1a1a6e;
        border-bottom:1px solid #eee; padding-bottom:6px; margin-bottom:10px;
        text-transform:uppercase; letter-spacing:.5px;
      }

      table.print-tbl { width:100%; border-collapse:collapse; font-size:11px; }
      table.print-tbl th {
        background:#f0f2ff; color:#1a1a6e; padding:7px 10px;
        text-align:left; font-size:10px; text-transform:uppercase;
        border:1px solid #e0e0e0; font-weight:700;
      }
      table.print-tbl th.num { text-align:right; }
      table.print-tbl td { padding:7px 10px; border:1px solid #e8e8e8; vertical-align:top; }
      table.print-tbl td.num { text-align:right; font-variant-numeric:tabular-nums; }
      table.print-tbl tr:nth-child(even) td { background:#fafafa; }
      table.print-tbl tr.total-row td { background:#e8f5e9; font-weight:700; }

      .print-retiro-box {
        background:#f0f2ff; border:1px solid #c5caf5; border-radius:6px;
        padding:10px 14px; margin-bottom:20px;
        font-size:12px; color:#1a1a6e;
      }
      .print-retiro-box strong { font-size:13px; }
      .page-break { page-break-after:always; }
    }
  </style>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="login-card">
    <img src="https://escuela-dandelion.github.io/Comision-Recursos/Logo_Diente_de_Leon.png" alt="Diente de León">
    <h2>Dashboard Referentes</h2>
    <p>Ingresá con tu cuenta de Google</p>
    <div id="google-btn-ref" style="display:flex;justify-content:center;margin-bottom:4px"></div>
    <div id="login-loading-ref" style="display:none;text-align:center;margin:8px 0">
      <div style="display:inline-block;width:22px;height:22px;border:3px solid #c8e6c9;border-top-color:#1a1a6e;border-radius:50%;animation:spin .7s linear infinite"></div>
    </div>
    <p id="login-error"></p>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="topbar">
    <img src="https://escuela-dandelion.github.io/Comision-Recursos/Logo_Diente_de_Leon.png" alt="Diente de León">
    <div class="topbar-info">
      <h1>Dashboard Referentes — Diente de León</h1>
      <p id="txt-actualizado">—</p>
    </div>
    <div id="ver-como-wrap">
      <span>Ver como:</span>
      <select id="ver-como-select" onchange="verComo(this.value)">
        <option value="">— yo (ADMIN) —</option>
      </select>
    </div>
    <div class="topbar-actions">
      <button class="topbar-btn pdf" id="btn-pdf" onclick="exportarPDF()" style="display:none">⬇ Exportar PDF</button>
      <a href="informe-aportes.html" class="topbar-btn" style="background:#1b5e20;color:#fff;border-color:#1b5e20">📄 Informe de Aportes</a>
      <button class="topbar-btn" id="btn-export" onclick="exportarSheets()" style="background:#2e7d32;color:#fff;border-color:#2e7d32">📊 Exportar a Sheets</button>
      <a href="dashboard-general.html" class="topbar-btn primary">↗ Ver general</a>
      <button class="topbar-btn" onclick="cerrarSesion()">Cerrar sesión</button>
    </div>
  </div>

  <div id="imp-banner-ref">
    <span>👁 Viendo como:</span>
    <strong id="imp-nombre-ref">—</strong>
    <button onclick="verComo('')">Volver a mi sesión</button>
  </div>

  <div class="body-layout">
    <div class="sidebar">
      <div class="sidebar-logo">
        <img src="https://escuela-dandelion.github.io/Comision-Recursos/Logo_Diente_de_Leon.png" alt="">
      </div>
      <div class="sidebar-section">
        <div class="sidebar-label">Filtros</div>
      </div>
      <div class="filter-label">Mes</div>
      <!-- En desktop: select normal. En mobile: dentro de .mobile-mes-row -->
      <select class="filter-select" id="filtro-mes" onchange="aplicarFiltros()">
        <option value="">Todos los meses</option>
      </select>

      <div class="filter-label">Desde</div>
      <input type="date" class="filter-date" id="filtro-desde" onchange="aplicarFiltros()">
      <div class="filter-label">Hasta</div>
      <input type="date" class="filter-date" id="filtro-hasta" onchange="aplicarFiltros()">
      <button class="filter-clear-dates" onclick="limpiarFechas()">✕ Limpiar fechas</button>

      <div class="filter-label">Proveedor</div>

var _GRADE_SUFFIX = {1:'ro',2:'do',3:'er',4:'to',5:'to',6:'to',7:'mo',8:'vo',9:'no',10:'mo',11:'vo',12:'vo'};
function canonicalGrade(n){ return n+(_GRADE_SUFFIX[n]||'vo'); }
function normalizarGrado(g){
  var s=String(g||'').trim(); if(!s) return 'Escuela';
  var l=s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(l==='j'||l.indexOf('jard')!==-1||l.indexOf('inic')!==-1) return 'Jardín';
  var T={'primer':1,'primero':1,'segundo':2,'tercer':3,'tercero':3,'cuarto':4,'quinto':5,
         'sexto':6,'septimo':7,'setimo':7,'octavo':8,'noveno':9,'decimo':10,
         'undecimo':11,'decimoprimero':11,'duodecimo':12,'decimosegundo':12};
  for(var k in T){ if(l.indexOf(k)!==-1) return canonicalGrade(T[k]); }
  var m=l.match(/^(\d+)/);
  if(m){ var n=parseInt(m[1]); if(n>=1&&n<=12){
    var r=l.slice(m[0].length).replace(/^(ro|do|er|to|vo|mo|no|°)/,'').replace(/^\s*(grado|año|de)?\s*$/,'').trim();
    if(!r) return canonicalGrade(n);
  }}
  return 'Escuela';
}
function gradoIdx(g){
  var s=String(g).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(s.indexOf('jard')!==-1) return 0; if(g==='Escuela') return 100;
  var m=s.match(/^(\d+)/); return m?parseInt(m[1]):100;
}
function nivelGrado(g){ var idx=gradoIdx(g); return (idx>=8&&idx<100)?'sec':'pri'; }
function sortGrados(arr){
  return arr.slice().sort(function(a,b){ var ai=gradoIdx(a),bi=gradoIdx(b); return ai!==bi?ai-bi:String(a).localeCompare(String(b),'es'); });
}
function pesos(n)    { return '$ '+(n||0).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function pesosCard(n){ return pesos(n); }
function mesLabel(m) { var p=m.split('-'),n=['','Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic']; return n[parseInt(p[1])]+' '+p[0].slice(2); }
function esc(s)      { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function waUrl(phone, msg) {
  var n = (phone || '').replace(/\D/g, '');
  if (!n) return '';
  if (n.substring(0, 2) !== '54') n = '54' + (n.charAt(0) === '0' ? n.slice(1) : n);
  return 'https://wa.me/' + n + (msg ? '?text=' + encodeURIComponent(msg) : '');
}

function waLink(phone, msg) {

  return '<a href="' + waUrl(phone, msg) + '" target="_blank" title="Escribir por WhatsApp" class="contact-btn">' + _WA_ICON + '</a>';

function parseFechaRow(s) {
  if(!s) return null;

  if(s.indexOf('T')!==-1) return s.slice(0,10);

var _tokenClientExport=null;
function exportarSheets(){
  if(!_tokenClientExport){
    _tokenClientExport=google.accounts.oauth2.initTokenClient({
      client_id:'308208183848-mcirv9g7cttetoa4eb1k6gt9p8chcr16.apps.googleusercontent.com',
      scope:'https://www.googleapis.com/auth/spreadsheets',

function _crearSheet(token){
  var titulo='DDL — Referentes '+new Date().toLocaleDateString('es-AR');
  fetch('https://sheets.googleapis.com/v4/spreadsheets',{
    method:'POST',
    headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
    body:JSON.stringify({properties:{title:titulo},sheets:[{properties:{title:'Ventas'}}]})
  })
  .then(function(r){ return r.ok?r.json():r.json().then(function(e){ throw new Error('Crear sheet: '+(e.error&&e.error.message||JSON.stringify(e))); }); })
  .then(function(ss){
    var id=ss.spreadsheetId, url=ss.spreadsheetUrl;
    var headers=[['Fecha','Mes','Pedido','Familia','Grado','Producto','Proveedor','Cantidad','Bruto','Pagado','Neto','Costo']];
    var filas=getRows().map(function(r){
      return [r.fecha||'',r.mes||'',r.pedido||'',r.familia||'',r.grado||'',
              r.producto||'',r.proveedor||'',r.cantidad||0,
              r.total_linea||0,r.total_pagado_linea||0,r.neto_linea||0,r.costo_linea||0];
    });
    return fetch('https://sheets.googleapis.com/v4/spreadsheets/'+id+'/values/Ventas!A1?valueInputOption=RAW',{
      method:'PUT',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json'},
      body:JSON.stringify({values:headers.concat(filas)})
    })
    .then(function(r){ return r.ok?url:r.json().then(function(e){ throw new Error('Escribir datos: '+(e.error&&e.error.message||JSON.stringify(e))); }); });
  })
  .then(function(url){ resetBtnExport(); window.open(url,'_blank'); })
  .catch(function(err){ resetBtnExport(); alert('Error: '+(err.message||'Intentá de nuevo.')); });
}
function hoy()       { return _hoy.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'}); }

// ── SESIÓN GOOGLE (24hs en localStorage) ──
var GOOGLE_SESSION_KEY = 'dl_admin_session';
function guardarSesionGoogle(email){ localStorage.setItem(GOOGLE_SESSION_KEY, JSON.stringify({ email: email, expires: Date.now() + 24*60*60*1000 })); }
function leerSesionGoogle()        { try{ var s=JSON.parse(localStorage.getItem(GOOGLE_SESSION_KEY)||'null'); return s&&Date.now()<s.expires?s.email:null; }catch(e){ return null; } }
function borrarSesionGoogle()      { localStorage.removeItem(GOOGLE_SESSION_KEY); }

function cerrarSesion(){
  borrarSesionGoogle();
  if(typeof google !== 'undefined') google.accounts.id.disableAutoSelect();
  document.getElementById('dashboard').style.display='none';
  document.getElementById('login').style.display='flex';
}
function showErr(msg){ var e=document.getElementById('login-error'); e.textContent=msg; e.style.display='block'; }
function hideErr()   { document.getElementById('login-error').style.display='none'; }

// ── AUTO-LOGIN al cargar ──
window.addEventListener('load', function(){
  var email = leerSesionGoogle();
  if (email) {
    // Mostrar cache inmediatamente si existe (< 30 min)
    try {
      var cached = JSON.parse(localStorage.getItem(DASH_CACHE_KEY)||'null');
      if (cached && cached.ok && (Date.now() - (cached._ts||0)) < 30*60*1000) {
        document.getElementById('login').style.display='none';
        document.getElementById('dashboard').style.display='flex';
        initDashboard(cached);
        document.getElementById('txt-actualizado').textContent='Versión: '+(cached.actualizado||'')+' (guardada)';
      }
    } catch(e){}
    // Siempre actualizar en background
    fetch(APPS_URL + '?action=api_dashboard&email=' + encodeURIComponent(email), { redirect:'follow' })
      .then(function(r){ return r.json(); })
      .then(function(d){
        if(d.ok){
          d._ts = Date.now();
          document.getElementById('login').style.display='none';
          document.getElementById('dashboard').style.display='flex';
          initDashboard(d);
        } else {
          borrarSesionGoogle();
          mostrarBotonesLogin();
        }
      }).catch(function(){ mostrarBotonesLogin(); });
    return;
  }
  mostrarBotonesLogin();
});

function mostrarBotonesLogin(){
  document.getElementById('login').style.display='flex';
  if(typeof google !== 'undefined'){
    google.accounts.id.initialize({ client_id: '308208183848-mcirv9g7cttetoa4eb1k6gt9p8chcr16.apps.googleusercontent.com', callback: onGoogleLoginRef });
    google.accounts.id.renderButton(document.getElementById('google-btn-ref'),
      { theme: 'outline', size: 'large', width: 280, text: 'signin_with', locale: 'es' });
  }
}

function onGoogleLoginRef(response) {
  var payload = JSON.parse(atob(response.credential.split('.')[1]));
  var email = payload.email;
  document.getElementById('google-btn-ref').style.display = 'none';
  document.getElementById('login-loading-ref').style.display = 'block';
  fetch(APPS_URL + '?action=api_dashboard&email=' + encodeURIComponent(email), { redirect:'follow' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      document.getElementById('login-loading-ref').style.display = 'none';
      document.getElementById('google-btn-ref').style.display = 'flex';
      if (d.ok) {
        guardarSesionGoogle(email);
        document.getElementById('login').style.display = 'none';
        document.getElementById('dashboard').style.display = 'flex';
        initDashboard(d);
      } else {
        showErr('Tu cuenta no tiene acceso. Contactá al administrador.');
      }
    })
    .catch(function(){
      document.getElementById('login-loading-ref').style.display = 'none';
      document.getElementById('google-btn-ref').style.display = 'flex';
      showErr('Error de conexión. Intentá de nuevo.');
    });
}

// ── INIT ──
function initDashboard(d){
  try { localStorage.setItem(DASH_CACHE_KEY, JSON.stringify(d)); } catch(e){}
  document.getElementById('loading-dash').style.display='none';
  var _ahora=new Date(); var _fmtFecha=_ahora.toLocaleDateString('es-AR',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+_ahora.toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('txt-actualizado').textContent='Versión actualizada: '+_fmtFecha+' · build 3';

  _userRole        = d.role || '';
  _userProveedores = d.proveedores || [];

  ALL_ROWS = (d.rows||[])
    .filter(function(r){ return PROVEEDORES_EXCLUIR_REFERENTES.indexOf(r.proveedor) === -1; })
    .map(function(r){ r.grado=normalizarGrado(r.grado); return r; });
  _ALL_ROWS_FULL  = ALL_ROWS;

  // FGP: filtrar a sus propios proveedores, ocultar selector de proveedor
  if (_userRole === 'FGP' && _userProveedores.length > 0) {
    ALL_ROWS = ALL_ROWS.filter(function(r){ return _userProveedores.indexOf(r.proveedor) !== -1; });
    document.getElementById('filtro-proveedor').style.display='none';
  }

  // ADMIN: poblar VerComo con lista de FGPs
  if (_userRole === 'ADMIN' && d.fgp_list && d.fgp_list.length > 0) {
    _fgpList = d.fgp_list;
    var vcSel = document.getElementById('ver-como-select');
    vcSel.innerHTML = '<option value="">— yo (ADMIN) —</option>';
    d.fgp_list.forEach(function(fgp, i){
      var o = document.createElement('option');
      o.value = String(i);
      o.textContent = fgp.name + ' — ' + fgp.proveedores.join(', ');
      vcSel.appendChild(o);
    });
    document.getElementById('ver-como-wrap').style.display = 'flex';
  }

  ALL_MESES       = d.meses_todos||[];
  ALL_RETIROS_MAP = d.retiros_map||{};

  // Mostrar filtro de estado solo si hay datos de entregas
  if(Object.keys(ALL_RETIROS_MAP).length>0){
    document.getElementById('lbl-estado').style.display='block';
    document.getElementById('filtro-estado').style.display='block';
  }

  var sel=document.getElementById('filtro-mes');
  while(sel.options.length > 1) sel.remove(1); // limpiar opciones previas (evita duplicados)
  ALL_MESES.forEach(function(m){
    var opt=document.createElement('option');
    opt.value=m; opt.textContent=mesLabel(m);
    if(m===_mesCorriente) opt.selected=true;
    sel.appendChild(opt);
  });
  currentMes=sel.value;

  var gradosMap={};
  ALL_ROWS.forEach(function(r){ gradosMap[r.grado]=(gradosMap[r.grado]||0)+1; });
  var grados=sortGrados(Object.keys(gradosMap));
  var nav=document.getElementById('grados-nav');
  nav.innerHTML='';

  // "Todos" primero
  var divTodos=document.createElement('div');
  divTodos.id='nav-todos';
  divTodos.className='grado-item active';
  divTodos.innerHTML='<span>Todos</span><span class="grado-badge">'+ALL_ROWS.length+'</span>';
  divTodos.onclick=function(){ toggleGrado(null); };
  nav.appendChild(divTodos);

  grados.forEach(function(g){
    var div=document.createElement('div');
    div.className='grado-item';
    div.dataset.grado=g;
    div.innerHTML='<span>'+esc(g)+'</span><span class="grado-badge">'+gradosMap[g]+'</span>';
    div.onclick=function(){ toggleGrado(g); };
    nav.appendChild(div);
  });
  selectedGrados=[];

  // Proveedores
  var provSet={};
  ALL_ROWS.forEach(function(r){ if(r.proveedor) provSet[r.proveedor]=true; });
  var selProv=document.getElementById('filtro-proveedor');
  selProv.innerHTML='<option value="">Todos los proveedores</option>';
  Object.keys(provSet).sort(function(a,b){ return a.localeCompare(b,'es'); }).forEach(function(p){
    var o=document.createElement('option'); o.value=p; o.textContent=p; selProv.appendChild(o);
  });

  // Marcas
  var marcaSet={};
  ALL_ROWS.forEach(function(r){ if(r.marca) marcaSet[r.marca]=true; });
  var selMarca=document.getElementById('filtro-marca');
  selMarca.innerHTML='<option value="">Todas las marcas</option>';
  Object.keys(marcaSet).sort(function(a,b){ return a.localeCompare(b,'es'); }).forEach(function(m){
    var o=document.createElement('option'); o.value=m; o.textContent=m; selMarca.appendChild(o);
  });

  document.getElementById('contenido').style.display='block';
  render();
}

function verComo(val) {
  if (!val) {
    ALL_ROWS = _ALL_ROWS_FULL;
    _userProveedores = [];
    document.getElementById('imp-banner-ref').style.display = 'none';
    document.getElementById('filtro-proveedor').style.display = '';
  } else {
    var fgp = _fgpList[parseInt(val)];
    if (!fgp) return;
    _userProveedores = fgp.proveedores;
    ALL_ROWS = _ALL_ROWS_FULL.filter(function(r){ return fgp.proveedores.indexOf(r.proveedor) !== -1; });
    document.getElementById('imp-nombre-ref').textContent = fgp.name + ' (' + fgp.proveedores.join(', ') + ')';
    document.getElementById('imp-banner-ref').style.display = 'flex';
    document.getElementById('filtro-proveedor').style.display = 'none';
  }
  _repoblarFiltros();
  selectedGrados = [];
  render();
}

function _repoblarFiltros() {
  var provSet = {}, marcaSet = {};
  ALL_ROWS.forEach(function(r){
    if (r.proveedor) provSet[r.proveedor] = true;
    if (r.marca) marcaSet[r.marca] = true;
  });
  var selProv = document.getElementById('filtro-proveedor');
  selProv.innerHTML = '<option value="">Todos los proveedores</option>';
  Object.keys(provSet).sort(function(a,b){ return a.localeCompare(b,'es'); }).forEach(function(p){
    var o = document.createElement('option'); o.value = p; o.textContent = p; selProv.appendChild(o);
  });
  var selMarca = document.getElementById('filtro-marca');
  selMarca.innerHTML = '<option value="">Todas las marcas</option>';
  Object.keys(marcaSet).sort(function(a,b){ return a.localeCompare(b,'es'); }).forEach(function(m){
    var o = document.createElement('option'); o.value = m; o.textContent = m; selMarca.appendChild(o);
  });
}

function toggleGrado(g){
  if(g===null){
    // Todos
    selectedGrados=[];
  } else {
    var idx=selectedGrados.indexOf(g);
    if(idx===-1) selectedGrados.push(g);
    else         selectedGrados.splice(idx,1);
  }
  // Actualizar clases activas
  var todos=document.getElementById('nav-todos');
  if(todos) todos.classList.toggle('active', selectedGrados.length===0);
  document.querySelectorAll('.grado-item[data-grado]').forEach(function(el){
    el.classList.toggle('active', selectedGrados.indexOf(el.dataset.grado)!==-1);
  });
  render();
}
function aplicarFiltros(){
  currentMes=document.getElementById('filtro-mes').value;
  currentDesde=document.getElementById('filtro-desde').value;
  currentHasta=document.getElementById('filtro-hasta').value;
  currentProveedor=document.getElementById('filtro-proveedor').value;
  currentMarca=document.getElementById('filtro-marca').value;
  currentEstado=document.getElementById('filtro-estado').value;
  render();
}
function setVista(v){ currentVista=v; render(); }

// ── DATOS FILTRADOS ──
function getRows(){
  var rows=ALL_ROWS;
  if(currentMes) rows=rows.filter(function(r){ return r.mes===currentMes; });
  if(currentDesde||currentHasta) rows=rows.filter(function(r){
    var f=parseFechaRow(r.fecha);
    if(!f) return true;
    if(currentDesde && f<currentDesde) return false;
    if(currentHasta && f>currentHasta) return false;
    return true;
  });
  if(currentProveedor) rows=rows.filter(function(r){ return r.proveedor===currentProveedor; });
  if(currentMarca) rows=rows.filter(function(r){ return r.marca===currentMarca; });
  if(selectedGrados.length>0) rows=rows.filter(function(r){ return selectedGrados.indexOf(r.grado)!==-1; });
  if(currentEstado && Object.keys(ALL_RETIROS_MAP).length>0){
    rows=rows.filter(function(r){
      var est=ALL_RETIROS_MAP[String(r.pedido)];
      if(currentEstado==='Entregado') return est==='Entregado';
      else return est!=='Entregado';
    });
  }
  return rows;
}

// ── RENDER ──
function render(){
  var rows=getRows();
  var cont=document.getElementById('contenido');
  var btnPdf=document.getElementById('btn-pdf');

  btnPdf.style.display='inline-flex';

  // KPIs
  var totalVendido=0,totalNeto=0,totalDescuentos=0,totalUnidades=0,pedidosSet={},familiasSet={};
  var familiasPorGrado={};
  var aportesPorGrado={}, totalAporteFondo=0;
  rows.forEach(function(r){
    totalVendido    +=(r.total_pagado_linea||r.total_linea||0);
    totalNeto       +=(r.neto_linea||r.total_pagado_linea||r.total_linea||0);
    totalDescuentos +=Math.max(0,(r.total_linea||0)-(r.total_pagado_linea||r.total_linea||0));
    totalUnidades   +=(r.cantidad||0);
    if(r.pedido) pedidosSet[r.pedido]=true;
    if(r.familia) familiasSet[r.familia]=true;
    if(r.grado && r.familia){
      if(!familiasPorGrado[r.grado]) familiasPorGrado[r.grado]={};
      familiasPorGrado[r.grado][r.familia]=true;
    }
    if(r.aporte_grado>0 && r.grado && r.grado!=='(Sin observaciones)' && r.grado!=='Escuela'){
      aportesPorGrado[r.grado]=(aportesPorGrado[r.grado]||0)+r.aporte_grado;
      totalAporteFondo+=r.aporte_grado;
    }
  });
  // Actualizar badges de grados con familias únicas del filtro actual
  var todosEl=document.getElementById('nav-todos');
  if(todosEl){ var b=todosEl.querySelector('.grado-badge'); if(b) b.textContent=Object.keys(familiasSet).length+' fam.'; }
  document.querySelectorAll('.grado-item[data-grado]').forEach(function(el){
    var b=el.querySelector('.grado-badge');
    var cnt=familiasPorGrado[el.dataset.grado]?Object.keys(familiasPorGrado[el.dataset.grado]).length:0;
    if(b) b.textContent=cnt+' fam.';
  });

  var mesTexto=currentMes?mesLabel(currentMes):'Todos los meses';
  var gradoTexto=selectedGrados.length===0?'Todos':selectedGrados.join(' · ');
  var nFam=Object.keys(familiasSet).length;
  var nPed=Object.keys(pedidosSet).length;

  var html='';

  // Header grado
  html+='<div class="grado-header">'+
    '<div>'+
      '<div class="grado-titulo">'+esc(gradoTexto)+'</div>'+
      '<div class="grado-subtitulo">'+mesTexto+' · '+nFam+' '+(nFam===1?'familia':'familias')+' · '+nPed+' pedido'+(nPed!==1?'s':'')+'</div>'+
    '</div>'+
    '<div class="grado-total">'+pesos(totalVendido)+'</div>'+
  '</div>';

  // Cards KPI
  html+='<div class="cards">'+
    '<div class="card green"><div class="card-label">Total vendido</div><div class="card-value">'+pesosCard(totalVendido)+'</div></div>'+
    '<div class="card teal"><div class="card-label">Neto recibido</div><div class="card-value">'+pesosCard(totalNeto)+'</div></div>'+
    '<div class="card orange"><div class="card-label">Descuentos</div><div class="card-value">'+pesosCard(totalDescuentos)+'</div></div>'+
    '<div class="card purple"><div class="card-label">Pedidos</div><div class="card-value">'+nPed+'</div></div>'+
    '<div class="card teal"><div class="card-label">Familias</div><div class="card-value">'+nFam+'</div></div>'+
    '<div class="card purple"><div class="card-label">Unidades</div><div class="card-value">'+Math.round(totalUnidades).toLocaleString('es-AR')+'</div></div>'+
  '</div>';

  // Fondo por grado
  if(totalAporteFondo>0){
    var gradosConAporte=sortGrados(Object.keys(aportesPorGrado));
    var fondoHtml='<div style="background:#f0f7e6;border:1px solid #c8e6c9;border-radius:10px;padding:12px 16px;margin-bottom:14px">';
    fondoHtml+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">';
    fondoHtml+='<span style="font-size:13px;font-weight:700;color:#2e7d32">Fondo por grado <span style="font-size:10px;font-weight:400;color:#6b9e6b">· Vigente desde el 01/09/2026</span></span>';
    fondoHtml+='<span style="font-size:14px;font-weight:700;color:#1a5c2a">'+pesos(totalAporteFondo)+'</span>';
    fondoHtml+='</div>';
    fondoHtml+='<div style="display:flex;flex-wrap:wrap;gap:6px">';
    gradosConAporte.forEach(function(g){
      fondoHtml+='<span style="background:#fff;border:1px solid #c8e6c9;border-radius:20px;padding:3px 10px;font-size:12px;color:#2e7d32">';
      fondoHtml+=esc(g)+' · <strong>'+pesos(aportesPorGrado[g])+'</strong></span>';
    });
    fondoHtml+='</div></div>';
    html+=fondoHtml;
  }

  // Resumen compacto de entregas (en unidades, igual que las filas)
  var _uEntr=0, _uPend=0;
  rows.forEach(function(r){
    if(ALL_RETIROS_MAP[String(r.pedido)]==='Entregado') _uEntr+=(r.cantidad||0);
    else _uPend+=(r.cantidad||0);
  });
  if(Object.keys(ALL_RETIROS_MAP).length>0){
    html+='<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;font-size:13px;font-weight:600">'+
      '<span style="background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:20px;padding:4px 12px">✅ '+Math.round(_uEntr)+' u. entregadas</span>'+
      '<span style="background:#fef9c3;color:#854d0e;border:1px solid #fde68a;border-radius:20px;padding:4px 12px">⏳ '+Math.round(_uPend)+' u. pendientes entregar</span>'+
    '</div>';
  }

  // Toggle de vista
  html+='<div class="view-toggle">'+
    '<button class="view-btn'+(currentVista==='familia'?' active':'')+'" onclick="setVista(\'familia\')">Por Familia</button>'+
    '<button class="view-btn'+(currentVista==='producto'?' active':'')+'" onclick="setVista(\'producto\')">Por Producto</button>'+
  '</div>';

  if(currentVista==='familia'){
    html+=renderFamilias(rows);
  } else {
    html+=renderProductos(rows);
  }

  // Guardar estado abierto antes de re-renderizar
  var _openFam={}, _openProd={}, _openGradeSec={};
  document.querySelectorAll('[id^="fam-"].open').forEach(function(el){ _openFam[el.id.replace('fam-','')]=true; });
  document.querySelectorAll('[id^="prod-"].open').forEach(function(el){ _openProd[el.id.replace('prod-','')]=true; });
  document.querySelectorAll('.grade-sec-body[data-grado]').forEach(function(el){ _openGradeSec[el.dataset.grado]=el.classList.contains('open'); });

  cont.innerHTML=html;

  // Restaurar estado abierto
  Object.keys(_openFam).forEach(function(i){
    var el=document.getElementById('fam-'+i); if(el) el.classList.add('open');
    var arr=document.getElementById('arr-fam-'+i); if(arr) arr.textContent='▼';
  });
  Object.keys(_openProd).forEach(function(i){
    var el=document.getElementById('prod-'+i); if(el) el.classList.add('open');
    var arr=document.getElementById('arr-prod-'+i); if(arr) arr.textContent='▼';
  });
  document.querySelectorAll('.grade-sec-body[data-grado]').forEach(function(el){
    var gr=el.dataset.grado;
    if(gr in _openGradeSec && !_openGradeSec[gr]){
      el.classList.remove('open');
      var gi=el.id.replace('grade-sec-','');
      var arr=document.getElementById('arr-grade-sec-'+gi);
      if(arr) arr.classList.remove('open');
    }
  });
}

// ── VISTA POR FAMILIA ──
function renderFamilias(rows){
  var familias={};
  rows.forEach(function(r){
    var f=r.familia||'Sin nombre';
    if(!familias[f]) familias[f]={email:r.email||'',phone:r.phone||'',grado:r.grado||'Escuela',total:0,unidades:0,items:[],_ped:{}};
    familias[f].total+=(r.total_pagado_linea||r.total_linea||0);
    familias[f].unidades+=(r.cantidad||0);
    familias[f].items.push(r);
    if(r.pedido&&!familias[f]._ped[r.pedido]) familias[f]._ped[r.pedido]=ALL_RETIROS_MAP[String(r.pedido)]||'Pendiente';
  });
  var famArr=Object.keys(familias).sort(function(a,b){ return familias[b].total-familias[a].total; });
  var totalUnidadesFam=famArr.reduce(function(s,f){ return s+familias[f].unidades; },0);

  var html='<div class="section-card">'+
    '<div class="section-head">'+
      '<div class="section-title">Familias <span>quién compró qué · clic para expandir</span></div>'+
      '<span class="section-count">'+famArr.length+' familias · '+Math.round(totalUnidadesFam)+' unidades</span>'+
    '</div>';

  var _hasRet=Object.keys(ALL_RETIROS_MAP).length>0;

  function renderFamRow(fname,fi){
    var fam=familias[fname];
    var _fUEntr=0, _fUPend=0;
    fam.items.forEach(function(it){
      if(ALL_RETIROS_MAP[String(it.pedido)]==='Entregado') _fUEntr+=(it.cantidad||0);
      else _fUPend+=(it.cantidad||0);
    });
    var _retBadge=_hasRet?
      '<div style="font-size:11px;margin-top:3px">'+
        (_fUEntr?'<span style="color:#15803d;font-weight:700">✅ '+Math.round(_fUEntr)+' u.</span>':'')+
        (_fUEntr&&_fUPend?' · ':'')+
        (_fUPend?'<span style="color:#92400e;font-weight:700">⏳ '+Math.round(_fUPend)+' u.</span>':'')+
      '</div>':'';
    var _pedKeys = Object.keys(fam._ped);
    var _lastPed = _pedKeys.length > 0 ? _pedKeys[_pedKeys.length - 1] : '';
    var _waMsgFam = '\uD83C\uDF3C Hola, te escribo de la Tienda Diente de León por tu pedido' + (_lastPed ? ' #' + _lastPed : '') + '.';
    var rowHtml='<div class="fam-row" onclick="toggleRow(\'fam\','+fi+')">'+
      '<div class="fam-left">'+
        '<span class="arrow" id="arr-fam-'+fi+'">▶</span>'+
        '<div><div class="fam-name">'+esc(fname)+contactBtns(fam.email,fam.phone,_waMsgFam)+'</div>'+emailTxt(fam.email)+_retBadge+'</div>'+
      '</div>'+
      '<div class="fam-right">'+
        '<span class="badge-units">'+Math.round(fam.unidades)+' u.</span>'+
        '<span class="badge-pesos">'+pesos(fam.total)+'</span>'+
      '</div>'+
    '</div>';
    // Tabla productos
    var prodMap={};
    fam.items.forEach(function(item){
      var key=item.producto+'||'+item.pedido;
      if(!prodMap[key]) prodMap[key]={nombre:item.producto,proveedor:item.proveedor||'',cantidad:0,subtotal_bruto:0,total_pagado:0,neto:0,pedido:item.pedido,fecha:item.fecha,fechaHora:item.fechaHora||item.fecha,order_discount:item.order_discount||0};
      prodMap[key].cantidad+=(item.cantidad||0);
      prodMap[key].subtotal_bruto+=(item.total_linea||0);
      prodMap[key].total_pagado+=(item.total_pagado_linea||item.total_linea||0);
      prodMap[key].neto+=(item.neto_linea||item.total_pagado_linea||item.total_linea||0);
    });
    rowHtml+='<div class="fam-body" id="fam-'+fi+'">'+
      '<table class="tbl-inner"><thead><tr>'+
        '<th>Producto</th><th class="num">Cant.</th><th class="num">Bruto</th><th class="num">Pagado</th><th class="num">Neto</th>'+
      '</tr></thead><tbody>';
    var pedidoGroups={};
    Object.values(prodMap).forEach(function(p){
      if(!pedidoGroups[p.pedido]) pedidoGroups[p.pedido]=[];
      pedidoGroups[p.pedido].push(p);
    });
    Object.keys(pedidoGroups).forEach(function(ped){
      var grupo=pedidoGroups[ped];
      var _est=ALL_RETIROS_MAP[String(ped)];
      var _entr=_est==='Entregado';
      var _icon=_entr?'✅':'⏳';
      var _color=_entr?'#15803d':'#92400e';
      var _bg=_entr?'#f0fdf4':'#fef9c3';
      var _fechaHora=grupo[0].fechaHora||grupo[0].fecha||'';
      rowHtml+='<tr style="background:'+_bg+';border-top:1px solid #e5e7eb">'+
        '<td colspan="5" style="padding:5px 12px;font-size:11px;font-weight:700;color:'+_color+'">'+
          _icon+' Pedido #'+esc(String(ped))+(_fechaHora?' — <span style="font-weight:400">'+esc(_fechaHora)+'</span>':'')+' — '+(_entr?'Entregado':'Pendiente de entrega')+
        '</td>'+
      '</tr>';
      grupo.forEach(function(p){
        rowHtml+='<tr>'+
          '<td>'+esc(p.nombre)+(p.proveedor?' <span class="chip">'+esc(p.proveedor)+'</span>':'')+' </td>'+
          '<td class="num">'+Math.round(p.cantidad)+'</td>'+
          '<td class="num" style="color:#999">'+pesos(p.subtotal_bruto)+'</td>'+
          '<td class="num"><strong>'+pesos(p.total_pagado)+'</strong></td>'+
          '<td class="num">'+pesos(p.neto)+'</td>'+
        '</tr>';
      });
      var disc=grupo[0].order_discount||0;
      if(disc>0.01){
        rowHtml+='<tr style="background:#fff8f8">'+
          '<td colspan="5" style="padding:4px 48px;font-size:11px;color:#e63946">'+
            '🏷 Descuento en pedido #'+esc(ped)+': <strong>–'+pesos(disc)+'</strong>'+
          '</td>'+
        '</tr>';
      }
    });
    rowHtml+='</tbody></table></div>';
    return rowHtml;
  }

  if(selectedGrados.length===1){
    // Un solo grado: lista plana sin cabeceras de grado
    famArr.forEach(function(fname,fi){ html+=renderFamRow(fname,fi); });
  } else {
    // Varios grados: agrupar con cabeceras expandibles/colapsables
    var gradeGroups={};
    famArr.forEach(function(fname){
      var g=familias[fname].grado||'Escuela';
      if(!gradeGroups[g]) gradeGroups[g]=[];
      gradeGroups[g].push(fname);
    });
    var sortedGrades=sortGrados(Object.keys(gradeGroups));
    var fi=0;
    sortedGrades.forEach(function(grado,gi){
      var gFams=gradeGroups[grado];
      var gTotal=gFams.reduce(function(s,f){ return s+familias[f].total; },0);
      html+='<div class="grade-sec-row" onclick="toggleGradeSec('+gi+')">'+
        '<span class="arrow open" id="arr-grade-sec-'+gi+'">▶</span>'+
        '<span class="grade-sec-name">'+esc(grado)+'</span>'+
        '<span class="grade-sec-count">'+gFams.length+' '+(gFams.length===1?'familia':'familias')+'</span>'+
        '<span class="badge-pesos">'+pesos(gTotal)+'</span>'+
      '</div>';
      html+='<div class="grade-sec-body open" id="grade-sec-'+gi+'" data-grado="'+esc(grado)+'">';
      gFams.forEach(function(fname){ html+=renderFamRow(fname,fi); fi++; });
      html+='</div>';
    });
  }

  if(!famArr.length) html+='<div style="text-align:center;padding:40px;color:#ccc;font-size:13px">Sin compras para este período</div>';
  html+='</div>';
  return html;
}

// ── VISTA POR PRODUCTO ──
function renderProductos(rows){
  var productos={};
  rows.forEach(function(r){
    var p=r.producto||'Sin nombre';
    if(!productos[p]) productos[p]={nombre:p,proveedor:r.proveedor||'',total:0,unidades:0,u_entr:0,u_pend:0,familias:{}};
    productos[p].total+=(r.total_pagado_linea||r.total_linea||0);
    productos[p].unidades+=(r.cantidad||0);
    if(ALL_RETIROS_MAP[String(r.pedido)]==='Entregado') productos[p].u_entr+=(r.cantidad||0);
    else productos[p].u_pend+=(r.cantidad||0);
    var f=r.familia||'Sin nombre';
    if(!productos[p].familias[f]) productos[p].familias[f]={email:r.email||'',phone:r.phone||'',cantidad:0,subtotal_bruto:0,total_pagado:0,neto:0,pedidos:[],fechaMap:{}};
    productos[p].familias[f].cantidad+=(r.cantidad||0);
    productos[p].familias[f].subtotal_bruto+=(r.total_linea||0);
    productos[p].familias[f].total_pagado+=(r.total_pagado_linea||r.total_linea||0);
    productos[p].familias[f].neto+=(r.neto_linea||r.total_pagado_linea||r.total_linea||0);
    if(r.pedido && productos[p].familias[f].pedidos.indexOf(r.pedido)===-1){
      productos[p].familias[f].pedidos.push(r.pedido);
      productos[p].familias[f].fechaMap[r.pedido]=r.fechaHora||r.fecha||'';
    }
  });
  var prodArr=Object.values(productos).sort(function(a,b){ return b.unidades-a.unidades; });
  var totalUnidadesRetiro=prodArr.reduce(function(s,p){ return s+p.unidades; },0);
  var _hasRet=Object.keys(ALL_RETIROS_MAP).length>0;

  var html='<div class="section-card">'+
    '<div class="section-head">'+
      '<div class="section-title">Lista de retiro <span>unidades a retirar por producto</span></div>'+
      '<span class="section-count">'+prodArr.length+' productos · '+Math.round(totalUnidadesRetiro)+' unidades</span>'+
    '</div>';

  prodArr.forEach(function(prod,pi){
    var famArr=Object.keys(prod.familias).sort(function(a,b){ return prod.familias[b].cantidad-prod.familias[a].cantidad; });
    html+='<div class="prod-row" onclick="toggleRow(\'prod\','+pi+')">'+
      '<div class="prod-left">'+
        '<span class="arrow" id="arr-prod-'+pi+'">▶</span>'+
        '<div>'+
          '<div class="prod-name">'+esc(prod.nombre)+'</div>'+
          (prod.proveedor?'<div class="prod-marca">'+esc(prod.proveedor)+'</div>':'')+
          (_hasRet?'<div style="font-size:11px;margin-top:3px">'+
            (prod.u_entr>0?'<span style="color:#15803d;font-weight:700">✅ '+Math.round(prod.u_entr)+' u.</span>':'')+
            (prod.u_entr>0&&prod.u_pend>0?' · ':'')+
            (prod.u_pend>0?'<span style="color:#92400e;font-weight:700">⏳ '+Math.round(prod.u_pend)+' u.</span>':'')+
          '</div>':'')+
        '</div>'+
      '</div>'+
      '<div class="prod-right">'+
        '<span class="badge-units-g">'+Math.round(prod.unidades)+' unidades</span>'+
        '<span class="badge-pesos">'+pesos(prod.total)+'</span>'+
      '</div>'+
    '</div>';

    html+='<div class="prod-body" id="prod-'+pi+'">'+
      '<table class="tbl-inner"><thead><tr>'+
        '<th>Familia</th><th class="num">Cant.</th><th class="num">Bruto</th><th class="num">Pagado</th><th class="num">Neto</th><th>Pedido</th>'+
      '</tr></thead><tbody>';
    famArr.forEach(function(fname){
      var f=prod.familias[fname];
      var _pedHtml=f.pedidos.map(function(pid){
        var _e=ALL_RETIROS_MAP[String(pid)]==='Entregado';
        var _fh=f.fechaMap&&f.fechaMap[pid]?'<div style="font-size:10px;color:#9ca3af">'+esc(f.fechaMap[pid])+'</div>':'';
        return '<div style="white-space:nowrap">'+(_e?'✅':'⏳')+' #'+esc(String(pid))+_fh+'</div>';
      }).join('');
      var _pid0=f.pedidos[0];
      var _fh0=f.fechaMap&&_pid0&&f.fechaMap[_pid0]?'<div style="font-size:10px;color:#9ca3af">'+esc(f.fechaMap[_pid0])+'</div>':'';
      var _noRetPed=f.pedidos.length===1?'#'+_pid0+_fh0:f.pedidos.length+' pedidos';
      html+='<tr>'+
        '<td><strong>'+esc(fname)+'</strong>'+contactBtns(f.email,f.phone,'\uD83C\uDF3C Hola, te escribo de la Tienda Diente de León por tu pedido #'+(f.pedidos[0]||'')+'.') +emailTxt(f.email)+'</td>'+
        '<td class="num"><span class="chip-g">'+Math.round(f.cantidad)+'</span></td>'+
        '<td class="num" style="color:#999">'+pesos(f.subtotal_bruto)+'</td>'+
        '<td class="num"><strong>'+pesos(f.total_pagado)+'</strong></td>'+
        '<td class="num">'+pesos(f.neto)+'</td>'+
        '<td style="font-size:12px">'+(_hasRet?_pedHtml:'<span class="txt-sm">'+_noRetPed+'</span>')+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  });

  if(!prodArr.length) html+='<div style="text-align:center;padding:40px;color:#ccc;font-size:13px">Sin compras para este período</div>';
  html+='</div>';
  return html;
}

function toggleRow(type,i){
  var body=document.getElementById(type+'-'+i);
  var arr=document.getElementById('arr-'+type+'-'+i);
  var open=body.classList.toggle('open');
  if(arr) arr.classList.toggle('open',open);
}
function toggleGradeSec(gi){
  var body=document.getElementById('grade-sec-'+gi);
  if(!body) return;
  var isOpen=body.classList.toggle('open');
  var arr=document.getElementById('arr-grade-sec-'+gi);
  if(arr) arr.classList.toggle('open',isOpen);
}

// ── PDF ──
function exportarPDF(){
  var rows=getRows();
  if(!rows.length){ alert('Sin datos para exportar.'); return; }

  var mesTexto=currentMes?mesLabel(currentMes):'Todos los meses';
  var gradoTexto=selectedGrados.length===0?'Todos':selectedGrados.join(' · ');

  // Armar productos
  var productos={};
  rows.forEach(function(r){
    var p=r.producto||'Sin nombre';
    if(!productos[p]) productos[p]={nombre:p,proveedor:r.proveedor||'',unidades:0,total:0,familias:{}};
    productos[p].unidades+=(r.cantidad||0);
    productos[p].total+=(r.total_pagado_linea||r.total_linea||0);
    var f=r.familia||'Sin nombre';
    if(!productos[p].familias[f]) productos[p].familias[f]={cantidad:0,subtotal:0,pedido:r.pedido,fecha:r.fecha,email:r.email||''};
    productos[p].familias[f].cantidad+=(r.cantidad||0);
    productos[p].familias[f].subtotal+=(r.total_pagado_linea||r.total_linea||0);
  });
  var prodArr=Object.values(productos).sort(function(a,b){ return b.unidades-a.unidades; });

  // Armar familias
  var familias={};
  rows.forEach(function(r){
    var f=r.familia||'Sin nombre';
    if(!familias[f]) familias[f]={email:r.email||'',total:0,unidades:0,items:[]};
    familias[f].total+=(r.total_pagado_linea||r.total_linea||0);
    familias[f].unidades+=(r.cantidad||0);
    familias[f].items.push(r);
  });
  var famArr=Object.keys(familias).sort(function(a,b){ return familias[b].total-familias[a].total; });

  var totalPesos=rows.reduce(function(s,r){ return s+(r.total_pagado_linea||r.total_linea||0); },0);
  var totalUnidades=rows.reduce(function(s,r){ return s+(r.cantidad||0); },0);

  var html='';

  // Header
  html+='<div class="print-header">'+
    '<img src="https://escuela-dandelion.github.io/Comision-Recursos/Logo_Diente_de_Leon.png" alt="Diente de León">'+
    '<div class="print-header-info">'+
      '<h1>Lista de Retiro — '+esc(gradoTexto)+'</h1>'+
      '<p>Mes: '+mesTexto+' · '+famArr.length+' familias · '+Math.round(totalUnidades)+' unidades · '+pesos(totalPesos)+'</p>'+
    '</div>'+
    '<div class="print-header-date">Generado el '+hoy()+'</div>'+
  '</div>';

  // Recuadro resumen
  html+='<div class="print-retiro-box">'+
    '<strong>Productos a retirar del proveedor: '+prodArr.length+'</strong> &nbsp;·&nbsp; '+
    'Total unidades: <strong>'+Math.round(totalUnidades)+'</strong> &nbsp;·&nbsp; '+
    'Total recaudado: <strong>'+pesos(totalPesos)+'</strong>'+
  '</div>';

  // Tabla resumen de retiro
  html+='<div class="print-section">'+
    '<div class="print-section-title">Resumen de retiro</div>'+
    '<table class="print-tbl"><thead><tr>'+
      '<th>#</th><th>Producto</th><th>Marca/Proveedor</th><th class="num">Unidades</th><th class="num">Recaudado</th><th class="num">Familias</th>'+
    '</tr></thead><tbody>';
  prodArr.forEach(function(p,i){
    html+='<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td><strong>'+esc(p.nombre)+'</strong></td>'+
      '<td>'+esc(p.proveedor)+'</td>'+
      '<td class="num"><strong>'+Math.round(p.unidades)+'</strong></td>'+
      '<td class="num">'+pesos(p.total)+'</td>'+
      '<td class="num">'+Object.keys(p.familias).length+'</td>'+
    '</tr>';
  });
  html+='<tr class="total-row"><td colspan="3">TOTAL</td><td class="num">'+Math.round(totalUnidades)+'</td><td class="num">'+pesos(totalPesos)+'</td><td class="num">'+famArr.length+'</td></tr>';
  html+='</tbody></table></div>';

  // Detalle por producto → familias
  html+='<div class="page-break"></div>';
  html+='<div class="print-section">'+
    '<div class="print-section-title">Detalle por producto — a quién entregar</div>';
  prodArr.forEach(function(prod){
    var famKeys=Object.keys(prod.familias).sort(function(a,b){ return prod.familias[b].cantidad-prod.familias[a].cantidad; });
    html+='<div style="margin-bottom:14px">'+
      '<div style="font-weight:700;font-size:12px;color:#1a1a6e;margin-bottom:4px">'+esc(prod.nombre)+(prod.proveedor?' <span style="font-weight:400;color:#888">('+esc(prod.proveedor)+')</span>':'')+' — <span style="color:#2e7d32">'+Math.round(prod.unidades)+' unidades</span></div>'+
      '<table class="print-tbl"><thead><tr>'+
        '<th>Familia</th><th>Email</th><th class="num">Cant.</th><th class="num">Subtotal</th><th>Pedido</th>'+
      '</tr></thead><tbody>';
    famKeys.forEach(function(fname){
      var f=prod.familias[fname];
      html+='<tr>'+
        '<td>'+esc(fname)+'</td>'+
        '<td style="color:#888">'+esc(f.email)+'</td>'+
        '<td class="num"><strong>'+Math.round(f.cantidad)+'</strong></td>'+
        '<td class="num">'+pesos(f.subtotal)+'</td>'+
        '<td>#'+esc(f.pedido||'—')+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  });
  html+='</div>';

  // Detalle por familia → productos
  html+='<div class="page-break"></div>';
  html+='<div class="print-section">'+
    '<div class="print-section-title">Detalle por familia — qué le entregamos a cada una</div>';
  famArr.forEach(function(fname){
    var fam=familias[fname];
    var prodMap={};
    fam.items.forEach(function(item){
      var key=item.producto;
      if(!prodMap[key]) prodMap[key]={nombre:item.producto,proveedor:item.proveedor||'',cantidad:0,subtotal:0};
      prodMap[key].cantidad+=(item.cantidad||0);
      prodMap[key].subtotal+=(item.total_linea||0);
    });
    html+='<div style="margin-bottom:14px">'+
      '<div style="font-weight:700;font-size:12px;color:#1a1a6e;margin-bottom:4px">'+
        esc(fname)+(fam.email?' <span style="font-weight:400;color:#888">('+esc(fam.email)+')</span>':'')+
        ' — <span style="color:#2e7d32">'+pesos(fam.total)+'</span>'+
      '</div>'+
      '<table class="print-tbl"><thead><tr>'+
        '<th>Producto</th><th>Marca/Proveedor</th><th class="num">Cant.</th><th class="num">Subtotal</th>'+
      '</tr></thead><tbody>';
    Object.values(prodMap).forEach(function(p){
      html+='<tr>'+
        '<td>'+esc(p.nombre)+'</td>'+
        '<td style="color:#888">'+esc(p.proveedor)+'</td>'+
        '<td class="num"><strong>'+Math.round(p.cantidad)+'</strong></td>'+
        '<td class="num">'+pesos(p.subtotal)+'</td>'+
      '</tr>';
    });
    html+='</tbody></table></div>';
  });
  html+='</div>';

  document.getElementById('print-area').innerHTML=html;
  window.print();
}
</script>
</body>
</html>
